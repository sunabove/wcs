<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Road Detection</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Font Awesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>

    <!-- WCS Common CSS -->
    <link href="./css/002_wcs_common.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js" defer></script>

     <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
            }
        }
    </script>

    <style>
        .image-drop-zone {
            border: 2px dashed #adb5bd;
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .image-drop-zone.drag-over {
            border-color: #0d6efd;
            background-color: #eaf3ff;
        }
    </style>

    <script src="./js/010_wcs_common.js" defer></script>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header class="p-1 text-bg-dark fs-5">

        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">

                <ul class="nav flex-grow-1 mb-2 justify-content-center mb-md-0">
                    <li>
                        <a href="300_ai_road.html" class="nav-link px-2 text-secondary">
                            <i class="bi bi-map me-2"></i>
                            Road Detection
                        </a>
                    </li> 
                </ul>

                <ul class="nav mb-2 ms-3 mb-md-0">
                    <li>
                        <a href="100_vehicle_status.html" class="nav-link px-2 text-white">
                            <i class="bi bi-speedometer2 me-2"></i>
                            WCS
                        </a>
                    </li>
                </ul> 

            </div>
        </div>
    </header>
    <!-- // 상단 메뉴 -->

    <main class="container-fluid my-4"> 

        <div class="card">
            
            <div class="card-header text-center">
                <h4 class="mb-0"> Road Detection </h4>
            </div>

            <div class="card-body p-2">
                <div class="row align-items-center g-2 mb-2">
                    <div class="col-2 text-center">
                        <span class="mb-0 fw-semibold text-nowrap">검출 종류</span>
                    </div>
                    <div class="col-10">
                        <form id="detection-type-form" class="border rounded p-3">
                            <div class="d-flex flex-nowrap gap-4 overflow-auto pe-1">
                                <div class="form-check mb-0 text-nowrap">
                                    <input class="form-check-input" type="checkbox" value="road" id="detect-road" checked>
                                    <label class="form-check-label" for="detect-road">도로</label>
                                </div>
                                <div class="form-check mb-0 text-nowrap">
                                    <input class="form-check-input" type="checkbox" value="road_type" id="detect-road-type">
                                    <label class="form-check-label" for="detect-road-type">도로 타입</label>
                                </div>
                                <div class="form-check mb-0 text-nowrap">
                                    <input class="form-check-input" type="checkbox" value="pothole" id="detect-pothole">
                                    <label class="form-check-label" for="detect-pothole">포트홀</label>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="row align-items-center g-2">
                    <div class="col-2 text-center">
                        <span class="mb-0 fw-semibold text-nowrap"> 이미지 </span>
                    </div>
                    <div class="col">
                        <form id="image-upload-form" class="border rounded p-3">
                            <input class="d-none" type="file" id="road-image-input" accept="image/*">
                            <div id="image-drop-zone" class="image-drop-zone">
                                <div class="fw-semibold">이미지를 드래그해서 놓으세요</div>
                                <div class="small text-muted mt-1">또는 클릭하여 파일 선택</div>
                            </div>
                            <div id="selected-image-name" class="small text-muted mt-2">선택된 파일 없음</div>

                            <div class="mt-3">
                                <div class="small text-muted mb-2">업로드 이미지</div>
                                <img
                                    id="uploaded-image-preview"
                                    src=""
                                    alt="업로드된 이미지"
                                    class="img-fluid border rounded"
                                >
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2024 Wheel Control System. All rights reserved.</p>
    </footer>

    <script>
        $(function () {
            const $dropZone = $("#image-drop-zone");
            const $fileInput = $("#road-image-input");
            const $selectedFileLabel = $("#selected-image-name");

            if ($dropZone.length === 0 || $fileInput.length === 0 || $selectedFileLabel.length === 0) {
                return;
            }

            function updateSelectedFile(file) {
                $selectedFileLabel.text(file ? "선택 파일: " + file.name : "선택된 파일 없음");
            }

            function uploadSelectedImage(file) {
                if (!file) {
                    return;
                }

                const formData = new FormData();
                formData.append("file", file);

                $.ajax({
                    url: "/fast/upload_image",
                    method: "POST",
                    data: formData,
                    processData: false,
                    contentType: false
                }).done(function (result) {
                    console.log(result.filename);
                }).fail(function (jqXHR) {
                    console.error("Image upload error:", jqXHR.status, jqXHR.responseText);
                });
            }

            $dropZone.on("click", function () {
                $fileInput.trigger("click");
            });

            $fileInput.on("change", function () {
                const files = this.files;
                const file = files && files[0] ? files[0] : null;
                updateSelectedFile(file);
                uploadSelectedImage(file);
            });

            $dropZone.on("dragenter dragover", function (event) {
                event.preventDefault();
                event.stopPropagation();
                $dropZone.addClass("drag-over");
            });

            $dropZone.on("dragleave drop", function (event) {
                event.preventDefault();
                event.stopPropagation();
                $dropZone.removeClass("drag-over");
            });

            $dropZone.on("drop", function (event) {
                const originalEvent = event.originalEvent;
                const files = originalEvent && originalEvent.dataTransfer ? originalEvent.dataTransfer.files : null;
                if (!files || files.length === 0) {
                    return;
                }

                const file = files[0];
                if (!file.type.startsWith("image/")) {
                    $selectedFileLabel.text("이미지 파일만 업로드할 수 있습니다.");
                    return;
                }

                $fileInput[0].files = files;
                updateSelectedFile(file);
                uploadSelectedImage(file);
            });
        });
    </script>

</body>

</html>
