<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URDF Viewer</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .robot-container {
            position: relative;
            min-height: 70vh;
        }

        .robot-container .label {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
        }
    </style>
    
</head>

<body class="bg-light">
    <div class="container-fluid py-3">
        <div class="row justify-content-center mb-3">
            <div class="col-12 col-xxl-10 text-center">
                <h1 class="h3 mb-1">URDF Viewer</h1>
                <p class="text-secondary mb-0">Mouse drag to rotate, scroll to zoom, click on robot to set target</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-xxl-10">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="robot-container urdf-container w-100" id="robot-container-1">
                            <span class="badge text-bg-dark label">URDF View</span>
                        </div>
                    </div>
                </div>

                <div class="alert alert-dark d-flex justify-content-between align-items-center mt-3 mb-0 py-2 px-3" id="camera-angle-panel" role="status">
                    <strong class="me-3">Camera Angle</strong>
                    <span id="camera-angle-text">azimuth: --°, polar: --°</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
            }
        }
    </script>
    <script type="module" src="urdf.js"></script>
</body>

</html>
