<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> YOLO Detectection </title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<style>
		#yolo-drop-zone.drag-active {
			border-color: #0d6efd;
			background: #e8f1ff;
			box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.2);
		}

		#yolo-drop-zone.file-selected {
			border-color: #198754;
			background: #eaf7ef;
			box-shadow: inset 0 0 0 1px rgba(25, 135, 84, 0.2);
		}

		#yolo-uploaded-list .list-group-item {
			min-width: 118px;
			max-width: 118px;
			padding: 0.4rem;
		}

		.yolo-uploaded-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.35rem;
		}

		.yolo-uploaded-thumb {
			width: 100%;
			height: 64px;
			object-fit: cover;
			border-radius: 0.35rem;
			border: 1px solid #dee2e6;
			background: #f1f5f9;
			flex-shrink: 0;
		}

		.yolo-uploaded-meta {
			width: 100%;
			min-width: 0;
			line-height: 1.2;
			text-align: center;
		}

	</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<header class="p-2 text-bg-dark fs-5">
	<div class="container d-flex justify-content-between align-items-center">
		<div>YOLO Video Detection</div>
		<div class="d-flex gap-2">
			<a href="/road/300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
			<a href="/sam2/500_ai_sam2.html" class="btn btn-outline-light btn-sm">SAM2</a>
			<a href="/simulation/simulation.html" class="btn btn-outline-light btn-sm">Simulation</a>
		</div>
	</div>
</header>

<main class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header">
			<h5 class="mb-0">YOLO 객체 검출</h5>
		</div>
		<div class="card-body p-2">
			<div class="table-responsive">
				<table class="table table-bordered align-middle mb-0">
					<colgroup>
							<col style="width: 140px;">
							<col>
					</colgroup>
					<tbody>
						<tr>
							<th scope="row" class="text-center text-nowrap">입력</th>
							<td>
								<ul class="nav nav-tabs" id="yolo-input-source-tabs" role="tablist">
									<li class="nav-item" role="presentation">
										<button class="nav-link active text-primary" id="yolo-uploaded-source-tab" data-bs-toggle="tab" data-bs-target="#yolo-uploaded-source-pane" type="button" role="tab" aria-controls="yolo-uploaded-source-pane" aria-selected="true">
											<i class="bi bi-upload me-1" aria-hidden="true"></i>
											&nbsp; 업로드 동영상
										</button>
									</li>
								</ul>
								<input id="yolo-video-file" class="d-none" type="file" accept="video/*">
								<div class="tab-content border border-top-0 rounded-bottom p-2 bg-white">
									<div class="tab-pane fade show active" id="yolo-uploaded-source-pane" role="tabpanel" aria-labelledby="yolo-uploaded-source-tab" tabindex="0">
										<ul id="yolo-uploaded-list" class="list-group list-group-sm d-flex flex-row flex-nowrap gap-2 align-items-stretch overflow-auto pb-1 mb-0" style="white-space: nowrap;">
											<li id="yolo-upload-item" class="list-group-item small flex-shrink-0">
												<div id="yolo-drop-zone" class="yolo-uploaded-item h-100 text-center text-primary" style="cursor: pointer;" role="button" tabindex="0" aria-label="동영상 파일 선택 또는 드래그 업로드">
													<div class="yolo-uploaded-thumb d-flex flex-column align-items-center justify-content-center border-primary" style="border-style: dashed;">
														<i class="bi bi-cloud-arrow-up fs-3" aria-hidden="true"></i>
														<span class="small fw-semibold">업로드</span>
													</div>
													<div id="yolo-selected-file" class="yolo-uploaded-meta text-truncate">파일 선택</div>
													<div id="yolo-upload-progress-wrap" class="d-none w-100" style="font-family: inherit;">
														<div class="progress position-relative w-100" role="progressbar" aria-label="동영상 업로드 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="height: 16px;">
															<div id="yolo-upload-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%;"></div>
															<span id="yolo-upload-progress-label" class="position-absolute top-50 start-50 translate-middle fw-semibold text-dark" style="font-size: 0.65rem; line-height: 1; text-shadow: 0 0 2px rgba(255, 255, 255, 0.9); font-family: inherit;">0%</span>
														</div>
													</div>
												</div>
											</li>
											<li id="yolo-uploaded-empty" class="list-group-item small text-muted">업로드 이력 없음</li>
										</ul>
									</div>
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">모델</th>
							<td>
								<ul class="nav nav-tabs" id="yolo-model-tabs" role="tablist"></ul>
								<div class="tab-content border border-top-0 rounded-bottom px-2 py-2 bg-white" id="yolo-model-tab-content">
									<div id="yolo-model-pane-template" class="border rounded p-3 h-100 bg-white">
											<div class="d-flex flex-nowrap gap-1 align-items-start" data-role="model-badges">
												<span class="d-inline-flex flex-wrap flex-grow-1 gap-1 align-items-center" data-role="class-list" style="min-width: 0;">
													<span class="badge text-bg-success border border-success flex-shrink-0" data-role="model-type" style="font-family: inherit; font-size: inherit;"></span>
												</span>
											</div>
									</div> 
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">옵션</th>
							<td>
								<div class="row g-3 align-items-stretch">
									<div class="col-lg-5 px-2 ">
										<div class="border rounded p-2 bg-white h-100 d-flex align-items-center">
											<div class="d-flex align-items-center gap-2 w-100">
												<label for="yolo-conf" class="form-label mb-0 small fw-semibold">Conf</label>
												<input id="yolo-conf" class="form-range flex-grow-1 mb-0" type="range" min="0" max="1" step="0.01" value="0.25">
												<span id="yolo-conf-value" class="badge text-bg-secondary">0.25</span>
											</div>
										</div>
									</div>
									<div class="col-lg-5 px-2 ">
										<div class="border rounded p-2 bg-white h-100 d-flex align-items-center">
											<div class="d-flex align-items-center gap-2 w-100">
												<label for="yolo-iou" class="form-label mb-0 small fw-semibold">IoU</label>
												<input id="yolo-iou" class="form-range flex-grow-1 mb-0" type="range" min="0" max="1" step="0.01" value="0.45">
												<span id="yolo-iou-value" class="badge text-bg-secondary">0.45</span>
											</div>
										</div>
									</div>
									<div class="col-lg-2 px-2 d-grid">
										<div class="border rounded p-2 bg-white h-100 d-grid">
											<button id="yolo-detect-btn" class="btn btn-primary h-100 w-100">검출 시작</button>
										</div>
									</div>
								</div> 
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">상태</th>
							<td class="p-1">
								<div id="yolo-status" class="alert alert-secondary mb-0 py-1 px-2 rounded-2 d-flex align-items-center w-100" style="line-height: 1.15; min-width: 0; font-family: inherit;">
									<span id="yolo-status-text" class="fs-6 fw-semibold text-dark">대기 중</span>
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">출력</th>
							<td>
								<div class="d-flex justify-content-between align-items-center mb-1">
									<ul class="nav nav-tabs" id="yolo-video-tabs" role="tablist">
										<li class="nav-item" role="presentation">
											<button class="nav-link active" id="yolo-input-tab" data-bs-toggle="tab" data-bs-target="#yolo-input-pane" type="button" role="tab" aria-controls="yolo-input-pane" aria-selected="true">📼 원본 영상</button>
										</li>
										<li class="nav-item" role="presentation">
											<button class="nav-link" id="yolo-output-tab" data-bs-toggle="tab" data-bs-target="#yolo-output-pane" type="button" role="tab" aria-controls="yolo-output-pane" aria-selected="false">🎯 검출 영상</button>
										</li>
									</ul>
									<div class="form-check form-switch mb-0 ms-2">
										<input class="form-check-input" type="checkbox" role="switch" id="yolo-loop-toggle">
										<label class="form-check-label small" for="yolo-loop-toggle">반복 재생</label>
									</div>
								</div>
								<div class="tab-content border border-top-0 rounded-bottom p-3 bg-white" id="yolo-video-tab-content">
									<div class="tab-pane fade show active" id="yolo-input-pane" role="tabpanel" aria-labelledby="yolo-input-tab" tabindex="0">
										<div class="text-center">
											<video id="yolo-input-video" class="border rounded d-inline-block mw-100" style="width: auto; height: auto; max-height: 70vh;" controls playsinline></video>
										</div>
									</div>
									<div class="tab-pane fade" id="yolo-output-pane" role="tabpanel" aria-labelledby="yolo-output-tab" tabindex="0">
										<div class="text-center">
											<video id="yolo-output-video" class="border rounded d-inline-block mw-100" style="width: auto; height: auto; max-height: 70vh;" controls playsinline></video>
										</div>
									</div>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</main>

<script src="400_ai_yolo.js" defer></script>
</body>
</html>
