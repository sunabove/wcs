<body class="bg-light">

		<div class="container d-flex justify-content-between align-items-center">
			<div>SAM2 Segmentation</div>
		<div class="d-flex gap-2">
			<a href="/road/300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
			<a href="/yolo/400_ai_yolo.html" class="btn btn-outline-light btn-sm">YOLO Detection</a>
			<a href="/simulation/simulation.html" class="btn btn-outline-light btn-sm">Simulation</a>
		</div>
	</div>

<main class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header">
			<h5 class="mb-0">SAM2 객체 검출</h5>
		</div>
		<div class="card-body p-2">
			<div class="table-responsive">
				<table class="table table-bordered align-middle mb-0">
					<colgroup><col style="width: 140px;"><col></colgroup>
					<tbody>
						<tr>
							<th scope="row" class="text-center text-nowrap">입력</th>
							<td>
								<ul class="nav nav-tabs" id="sam2-input-source-tabs" role="tablist">
									<li class="nav-item" role="presentation"><button class="nav-link active text-secondary" id="sam2-uploaded-source-tab" data-bs-toggle="tab" data-bs-target="#sam2-uploaded-source-pane" type="button" role="tab" aria-selected="true"><i class="bi bi-upload me-1" aria-hidden="true"></i>업로드 동영상</button></li>
								</ul>

								<div class="tab-content border border-top-0 rounded-bottom p-2 bg-white">
									<div class="tab-pane fade show active" id="sam2-uploaded-source-pane" role="tabpanel">
										<div class="d-flex align-items-center gap-2 mb-1 mt-3"><div id="sam2-uploaded-loading" class="small text-primary d-inline-flex align-items-center" aria-live="polite"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span><span id="sam2-uploaded-loading-text">동영상 목록을 불러오는 중...</span></div></div>

										</ul>
									</div>
								</div>
							</td>
						</tr>
						<tr>

									<div class="form-switch d-inline-flex align-items-center gap-1 mb-0">

									</div>
									<div class="form-switch d-inline-flex align-items-center gap-1 mb-0">
										<span class="small text-secondary">CLAHE</span>

										<input id="sam2-multimask-output" class="form-check-input m-0" type="checkbox" role="switch" disabled>
										<label id="sam2-multimask-output-text" class="form-check-label small text-center d-inline-block" style="width: 5.5rem;" for="sam2-multimask-output">Single mask</label>
									</div>
									<button id="sam2-detect-btn" type="button" class="btn btn-success ms-auto">검출 시작</button>
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">상태</th>
							<td class="p-1"><div id="sam2-status" class="alert alert-secondary my-0 py-2 px-2" style="line-height: 1.15;">대기 중</div></td>
						</tr>
						<tr>
							<th scope="row" class="text-center text-nowrap">출력</th>

sam2-input-stage border rounded overflow-hidden"><video id="sam2-input-video" class="sam2-video-player" controls playsinline></video><div id="sam2-point-marker-layer" class="sam2-point-marker-layer" aria-hidden="true"></div><div id="sam2-bbox-layer" class="sam2-bbox-layer" aria-hidden="true"></div><div id="sam2-bbox-capture-layer" class="sam2-bbox-capture-layer" aria-label="Bounding Box 입력 레이어"></div></div></div></div><div class="tab-pane fade" id="sam2-output-pane" role="tabpanel" aria-labelledby="sam2-output-tab"><div class="sam2-video-wrap"><video id="sam2-output-video" class="sam2-video-player border rounded" controls playsinline></video><div class="d-flex flex-wrap justify-content-end align-items-center gap-2 mt-2"><span id="sam2-yolo-dataset-summary" class="small text-muted me-auto">YOLO 학습 데이터 대기 중</span><button id="sam2-yolo-dataset-download" type="button" class="btn btn-outline-primary btn-sm" disabled title="YOLO 학습 데이터 다운로드"><i class="bi bi-database me-1" aria-hidden="true"></i>YOLO 데이터 다운로드</button><button id="sam2-output-download" type="button" class="btn btn-outline-success btn-sm" disabled title="검출 영상 다운로드"><i class="bi bi-download me-1" aria-hidden="true"></i>다운로드</button></div></div></div></div></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
