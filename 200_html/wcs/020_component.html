<!-- MQTT 상태 및 메시지 표시 컴포넌트 -->

<div class="mqtt-status-message-inline d-flex flex-nowrap align-items-center">
    <div id="mqtt-status-container" class="d-flex flex-nowrap align-items-center me-3">
        <!-- MQTT 상태가 여기에 동적으로 추가됩니다 -->
    </div>
    <div id="mqtt-message-display" class="d-flex flex-nowrap align-items-center mqtt-message-display-fixed">
        <div class="badge bg-info text-dark fs-6 px-2 py-2 w-100 d-flex align-items-center mqtt-message-badge-wrap">
            <i class="fas fa-chart-bar me-2 flex-shrink-0"></i>
            <div class="mqtt-message-row d-flex justify-content-between align-items-center w-100 text-truncate">
                <i class="fas fa-arrow-down text-white-50 flex-shrink-0" title="수신" aria-label="수신"></i>
                <span id="mqtt-received-count" class="fw-bold text-white flex-shrink-0 text-nowrap">0</span>
                <i class="fas fa-arrow-up text-white-50 flex-shrink-0 ms-3" title="발행" aria-label="발행"></i>
                <span id="mqtt-published-count" class="fw-bold text-white flex-shrink-0 text-nowrap">0</span>
            </div>
        </div>
    </div>
</div>

<!-- // MQTT 상태 및 메시지 표시 컴포넌트 -->
