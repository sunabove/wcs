<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AI YOLO Video Detect</title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		#yolo-drop-zone {
			border: 2px dashed #9aa4b2;
			border-radius: 10px;
			background: #f8fafc;
			padding: 14px;
			text-align: center;
			cursor: pointer;
			transition: all 0.15s ease;
			color: #334155;
		}

		#yolo-drop-zone.drag-active {
			border-color: #0d6efd;
			background: #e8f1ff;
			box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.2);
		}

		#yolo-selected-file {
			font-size: 0.875rem;
			color: #475569;
		}

		.yolo-video-wrap {
			text-align: center;
		}

		.yolo-video-player {
			width: auto;
			height: auto;
			max-width: 100%;
			max-height: 70vh;
			display: inline-block;
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<header class="p-2 text-bg-dark fs-5">
	<div class="container d-flex justify-content-between align-items-center">
		<div>YOLO Video Detection</div>
		<a href="300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
	</div>
</header>

<main class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header">
			<h5 class="mb-0">동영상 업로드 후 YOLO 최신 모델 검출</h5>
		</div>
		<div class="card-body">
			<div class="row g-3 align-items-start">
				<div class="col-12 col-lg-6">
					<label for="yolo-video-file" class="form-label">동영상 파일</label>
					<input id="yolo-video-file" class="form-control mb-2" type="file" accept="video/*">
					<div id="yolo-drop-zone" role="button" tabindex="0" aria-label="동영상 드래그 업로드 영역">
						<div class="fw-semibold">동영상을 여기로 드래그하세요</div>
						<div class="small text-muted mt-1">또는 클릭해서 파일 선택</div>
					</div>
					<div id="yolo-selected-file" class="mt-1">선택된 파일 없음</div>
				</div>
				<div class="col-12 col-lg-6">
					<div class="row g-2">
						<div class="col-6">
							<label for="yolo-conf" class="form-label">Conf</label>
							<input id="yolo-conf" class="form-control" type="number" min="0" max="1" step="0.05" value="0.25">
						</div>
						<div class="col-6">
							<label for="yolo-iou" class="form-label">IoU</label>
							<input id="yolo-iou" class="form-control" type="number" min="0" max="1" step="0.05" value="0.45">
						</div>
						<div class="col-12 d-grid">
							<button id="yolo-detect-btn" class="btn btn-primary">검출 시작</button>
						</div>
					</div>
				</div>
			</div>

			<div id="yolo-status" class="alert alert-secondary mt-2 mb-0">대기 중</div>

			<div class="mt-3">
				<ul class="nav nav-tabs" id="yolo-video-tabs" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" id="yolo-input-tab" data-bs-toggle="tab" data-bs-target="#yolo-input-pane" type="button" role="tab" aria-controls="yolo-input-pane" aria-selected="true">📼 원본 영상</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="yolo-output-tab" data-bs-toggle="tab" data-bs-target="#yolo-output-pane" type="button" role="tab" aria-controls="yolo-output-pane" aria-selected="false">🎯 검출 영상</button>
					</li>
				</ul>
				<div class="tab-content border border-top-0 rounded-bottom p-3 bg-white" id="yolo-video-tab-content">
					<div class="tab-pane fade show active" id="yolo-input-pane" role="tabpanel" aria-labelledby="yolo-input-tab" tabindex="0">
						<div class="yolo-video-wrap">
							<video id="yolo-input-video" class="yolo-video-player border rounded" controls playsinline></video>
						</div>
					</div>
					<div class="tab-pane fade" id="yolo-output-pane" role="tabpanel" aria-labelledby="yolo-output-tab" tabindex="0">
						<div class="yolo-video-wrap">
							<video id="yolo-output-video" class="yolo-video-player border rounded" controls playsinline></video>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>

<script src="400_ai_yolo.js" defer></script>
</body>
</html>
