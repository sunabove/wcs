    <!-- Vehicle Test 페이지 전용 JavaScript -->
    <script>
        $(document).ready(function() {
            const pendingPublishTimers = {};
            let lastVehicleMaxSpeedMsSent = null;
            window.vehicleSpeedUiManualUntil = 0;
            window.suppressAutoStopUntil = 0;
            window.manualWheelTestActive = false;
            window.manualWheelTestWheel = null;
            window.vehicleDirectionCommandActive = false;

            function cancelPendingPublish(topic) {
                if (pendingPublishTimers[topic]) {
                    clearTimeout(pendingPublishTimers[topic]);
                    pendingPublishTimers[topic] = null;
                }
            }

            function updateVehicleSpeedUi(speedKmh, isManual = false) {
                const numericKmh = Number.parseFloat(speedKmh);
                const normalizedKmh = Number.isFinite(numericKmh) ? Math.max(0, numericKmh) : 0;
                $('#vehicleMaxSpeedSlider').val(normalizedKmh);
                $('[id="vehicle/max_speed"]').text(`${normalizedKmh.toFixed(1)} Km/h`);

                if (isManual) {
                    window.vehicleSpeedUiManualUntil = Date.now() + 1500;
                }
            }

            function publishWhenConnected(topic, payload, retries = 20, intervalMs = 250) {
                if (pendingPublishTimers[topic]) {
                    clearTimeout(pendingPublishTimers[topic]);
                    pendingPublishTimers[topic] = null;
                }

                const isConnected = Boolean(window.mqttClient && window.mqttClient.connected);
                if (isConnected) {
                    sendMQTTMessage(topic, payload, 1);
                    return;
                }

                if (retries <= 0) {
                    console.warn(`[Vehicle Test] MQTT 미연결로 발행 실패: ${topic}`);
                    return;
                }

                pendingPublishTimers[topic] = setTimeout(() => {
                    pendingPublishTimers[topic] = null;
                    publishWhenConnected(topic, payload, retries - 1, intervalMs);
                }, intervalMs);
            }

            // 바퀴 선택 변경 이벤트
            $('input[name="wheelTestPosition"]').change(function() {
                const selectedWheel = $(this).val();
                console.log(`[Vehicle Test] 🎯 바퀴 선택 변경: ${selectedWheel}`);

                if (typeof window.setVehicleWheelHighlightByKey === 'function') {
                    window.setVehicleWheelHighlightByKey(selectedWheel.toLowerCase());
                }
            });

            // 페이지 로드시 초기 선택 바퀴 하이라이트
            const initialWheel = $('input[name="wheelTestPosition"]:checked').val().toLowerCase();
            if (typeof window.setVehicleWheelHighlightByKey === 'function') {
                window.setVehicleWheelHighlightByKey(initialWheel);
            }

            // 페이지 로드시 정지 버튼 기본 활성화
            $('#vehicle-forward, #vehicle-backward, #vehicle-turn-left, #vehicle-turn-right, #vehicle-stop')
                .removeClass('active text-white')
                .addClass('text-black');
            $('#vehicle-stop')
                .addClass('active text-white')
                .removeClass('text-black');

            function getVehicleCommandByButtonId(buttonId) {
                switch (buttonId) {
                    case 'vehicle-forward':
                        return 1;
                    case 'vehicle-backward':
                        return 2;
                    case 'vehicle-turn-left':
                        return 3;
                    case 'vehicle-turn-right':
                        return 4;
                    case 'vehicle-stop':
                    default:
                        return 0;
                }
            }

            function publishSelectedVehicleCommandOnLoad() {
                const vehicleButtonSelector = '#vehicle-forward, #vehicle-backward, #vehicle-turn-left, #vehicle-turn-right, #vehicle-stop';
                const selectedButton = $(vehicleButtonSelector).filter('.active').first();
                const selectedButtonId = selectedButton.length ? selectedButton.attr('id') : 'vehicle-stop';
                const selectedCommand = getVehicleCommandByButtonId(selectedButtonId);

                publishWhenConnected('vehicle/operation/command', selectedCommand);
                applyVehicleCommandWheelHighlight(selectedCommand);
                console.log(`[Vehicle Test] 📨 초기 방향 제어 명령 발행: vehicle/operation/command = ${selectedCommand} (${selectedButtonId})`);
            }

            publishSelectedVehicleCommandOnLoad();

            // 테스트 화면 로딩 시 시뮬레이션 중지 명령을 무조건 1회 발행
            publishWhenConnected('simulation/stop', 'stop');

            function applyVehicleCommandWheelHighlight(command) {
                const commandNumber = Number(command);

                if (commandNumber === 0) {
                    if (typeof window.clearVehicleWheelHighlights === 'function') {
                        window.clearVehicleWheelHighlights();
                    }
                    return;
                }

                if (commandNumber === 1) {
                    // 전진 시 앞쪽 두 바퀴 강조
                    if (typeof window.setVehicleWheelHighlightByKeys === 'function') {
                        window.setVehicleWheelHighlightByKeys(['fl', 'fr']);
                    }
                    return;
                }

                if (commandNumber === 2) {
                    // 후진 시 뒤쪽 두 바퀴 강조
                    if (typeof window.setVehicleWheelHighlightByKeys === 'function') {
                        window.setVehicleWheelHighlightByKeys(['rl', 'rr']);
                    }
                    return;
                }

                if (commandNumber === 3) {
                    // 좌회전 시 우측 바퀴(외측)가 상대적으로 빠르므로 강조
                    if (typeof window.setVehicleWheelHighlightByKeys === 'function') {
                        window.setVehicleWheelHighlightByKeys(['fr', 'rr']);
                    }
                    return;
                }

                if (commandNumber === 4) {
                    // 우회전 시 좌측 바퀴(외측)가 상대적으로 빠르므로 강조
                    if (typeof window.setVehicleWheelHighlightByKeys === 'function') {
                        window.setVehicleWheelHighlightByKeys(['fl', 'rl']);
                    }
                    return;
                }
            }

            $('#test-clockwise, #test-counterclockwise, #test-stop')
                .removeClass('active btn-secondary text-white')
                .addClass('btn-outline-secondary text-black');
            $('#test-stop')
                .removeClass('btn-outline-secondary text-black')
                .addClass('active btn-secondary text-white');

            // 바퀴 테스트 명령 전송 함수
            function sendWheelCommand(command, buttonElement, actionName, icon) {
                const selectedWheel = $('input[name="wheelTestPosition"]:checked').val().toLowerCase();
                const topic = `wheel/${selectedWheel}/operation/command`;
                const angularSpeedAbs = Number.parseFloat($('#wheelTestSpeedSlider').val()) || 0;
                window.suppressAutoStopUntil = Date.now() + 1500;
                window.manualWheelTestActive = Number(command) === 1 || Number(command) === 2;
                window.manualWheelTestWheel = window.manualWheelTestActive ? selectedWheel : null;

                // 페이지 로드시 예약된 simulation/stop 재발행이 늦게 들어와 수동 휠 테스트를 끊지 않도록 취소
                cancelPendingPublish('simulation/stop');

                if (typeof window.setVehicleWheelHighlightByKey === 'function') {
                    window.setVehicleWheelHighlightByKey(selectedWheel);
                }

                // 휠 테스트 버튼은 항상 클릭된 버튼 하나만 하이라이트
                $('#test-clockwise, #test-counterclockwise, #test-stop')
                    .removeClass('active btn-secondary text-white')
                    .addClass('btn-outline-secondary text-black');

                buttonElement
                    .removeClass('btn-outline-secondary text-black')
                    .addClass('active btn-secondary text-white');

                sendMQTTMessage(topic, command, 1);

                if (Number(command) === 1 || Number(command) === 2) {
                    const signedAngularSpeed = Number(command) === 2 ? -angularSpeedAbs : angularSpeedAbs;
                    sendMQTTMessage(`wheel/${selectedWheel}/angle/speed`, signedAngularSpeed, 1);

                    if (typeof setWheelAnimationByKey === 'function') {
                        const rpm = (signedAngularSpeed * 60) / (2 * Math.PI);
                        setWheelAnimationByKey(selectedWheel, Math.round(rpm));
                    }
                } else if (Number(command) === 0) {
                    // 정지 시점에 선택된 휠의 각속도를 즉시 0으로 맞춘다.
                    sendMQTTMessage(`wheel/${selectedWheel}/angle/speed`, '0', 1);

                    if (typeof setWheelAnimationByKey === 'function') {
                        setWheelAnimationByKey(selectedWheel, 0);
                    }
                }

                console.log(`[Vehicle Test] ${icon} ${selectedWheel.toUpperCase()} 바퀴 ${actionName} 명령 전송: ${topic} = ${command}`);
                
                // 버튼 피드백 - 더 명확한 시각적 효과
                const originalOpacity = buttonElement.css('opacity');
                const originalTransform = buttonElement.css('transform');
                
                buttonElement
                    .css({
                        'opacity': '0.7',
                        'transform': 'scale(0.95)',
                        'transition': 'all 0.1s ease'
                    })
                    .addClass('shadow-lg');

                setTimeout(() => {
                    buttonElement
                        .css({
                            'opacity': originalOpacity,
                            'transform': originalTransform
                        })
                        .removeClass('shadow-lg');
                }, 1000);
            }

            // 차량 제어 명령 전송 함수
            function sendVehicleCommand(command, buttonElement, actionName, icon) {
                const topic = 'vehicle/operation/command';
                const speedTopic = 'vehicle/linear/speed';
                const sliderSpeedKmh = Number.parseFloat($('#vehicleMaxSpeedSlider').val()) || 0;
                const sliderSpeedMs = sliderSpeedKmh / 3.6;
                const speedMs = sliderSpeedMs;
                const roundedSpeedMs = Number(speedMs.toFixed(2));
                window.suppressAutoStopUntil = Date.now() + 1500;
                window.manualWheelTestActive = false;
                window.manualWheelTestWheel = null;
                window.vehicleDirectionCommandActive = Number(command) >= 1 && Number(command) <= 4;

                // 페이지 로드시 예약된 simulation/stop 지연 발행이 차량 제어를 덮어쓰지 않도록 취소
                cancelPendingPublish('simulation/stop');
                
                // 모든 차량 제어 버튼에서 active와 text-white 클래스 제거
                $('#vehicle-forward, #vehicle-backward, #vehicle-turn-left, #vehicle-turn-right, #vehicle-stop')
                    .removeClass('active text-white')
                    .addClass('text-black');
                
                // 클릭된 버튼에만 active와 text-white 클래스 추가
                buttonElement
                    .addClass('active text-white')
                    .removeClass('text-black');

                applyVehicleCommandWheelHighlight(command);
                applyVehicleWheelAnimationByCommand(command);

                // 방향 명령 변경 시 현재 속도를 함께 발행해 서버 측 반영 시점을 맞춘다.
                publishWhenConnected(speedTopic, roundedSpeedMs);
                lastVehicleMaxSpeedMsSent = roundedSpeedMs;
                
                publishWhenConnected(topic, command);
                console.log(`[Vehicle Test] ${icon} 차량 ${actionName} 명령 전송: ${topic} = ${command}, ${speedTopic} = ${roundedSpeedMs}`);
                
                // 버튼 피드백 - 더 명확한 시각적 효과
                const originalOpacity = buttonElement.css('opacity');
                const originalTransform = buttonElement.css('transform');
                
                buttonElement
                    .css({
                        'opacity': '0.7',
                        'transform': 'scale(0.95)',
                        'transition': 'all 0.1s ease'
                    })
                    .addClass('shadow-lg');

                setTimeout(() => {
                    buttonElement
                        .css({
                            'opacity': originalOpacity,
                            'transform': originalTransform
                        })
                        .removeClass('shadow-lg');
                }, 1000);
            }

            function applyVehicleWheelAnimationByCommand(command) {
                if (typeof setWheelAnimationByKey !== 'function') {
                    return;
                }

                const sliderSpeedKmh = Number.parseFloat($('#vehicleMaxSpeedSlider').val()) || 0;
                const sliderSpeedMs = sliderSpeedKmh / 3.6;
                const telemetrySpeedMs = Number.parseFloat(window.latestVehicleLinearSpeedMs);
                const speedMs = Number.isFinite(telemetrySpeedMs) ? Math.abs(telemetrySpeedMs) : sliderSpeedMs;
                const wheelRadiusM = 0.32;
                const baseRpm = ((speedMs / wheelRadiusM) * 60) / (2 * Math.PI);

                const setRpmAll = (fl, fr, rl, rr) => {
                    setWheelAnimationByKey('fl', Math.round(fl));
                    setWheelAnimationByKey('fr', Math.round(fr));
                    setWheelAnimationByKey('rl', Math.round(rl));
                    setWheelAnimationByKey('rr', Math.round(rr));
                };

                const commandNumber = Number(command);
                switch (commandNumber) {
                    case 0:
                        setRpmAll(0, 0, 0, 0);
                        break;
                    case 1: // 전진
                        setRpmAll(baseRpm, baseRpm, baseRpm, baseRpm);
                        break;
                    case 2: // 후진
                        setRpmAll(-baseRpm * 0.8, -baseRpm * 0.8, -baseRpm * 0.8, -baseRpm * 0.8);
                        break;
                    case 3: // 좌회전
                        setRpmAll(baseRpm * 0.6 * 0.7, baseRpm * 0.6 * 1.3, baseRpm * 0.6 * 0.7, baseRpm * 0.6 * 1.3);
                        break;
                    case 4: // 우회전
                        setRpmAll(baseRpm * 0.6 * 1.3, baseRpm * 0.6 * 0.7, baseRpm * 0.6 * 1.3, baseRpm * 0.6 * 0.7);
                        break;
                    default:
                        break;
                }
            }

            // 테스트 버튼 이벤트 - 통합된 함수 사용
            $('#test-clockwise').click(function() {
                sendMQTTMessage('simulation/stop', 'stop', 1);
                sendWheelCommand(1, $(this), '정회전', '⏰');
            });

            $('#test-counterclockwise').click(function() {
                sendMQTTMessage('simulation/stop', 'stop', 1);
                sendWheelCommand(2, $(this), '역회전', '↩️');
            });

            $('#test-stop').click(function() {
                sendWheelCommand(0, $(this), '정지', '⏹️');
            });

            // 휠 테스트 속도 슬라이더 표시 업데이트
            $('#wheelTestSpeedSlider').on('input change', function() {
                const speedRad = Number.parseFloat($(this).val()) || 0;
                const rpm = (speedRad * 60) / (2 * Math.PI);
                $('#wheel-test-speed-value').text(`${Math.round(rpm)} rpm`);
            });

            // 차량 제어 버튼 이벤트
            $('#vehicle-forward').click(function() {
                sendVehicleCommand(1, $(this), '전진', '⬆️');
            });

            $('#vehicle-backward').click(function() {
                sendVehicleCommand(2, $(this), '후진', '⬇️');
            });

            $('#vehicle-turn-left').click(function() {
                sendVehicleCommand(3, $(this), '좌회전', '⬅️'); 
            });

            $('#vehicle-turn-right').click(function() {
                sendVehicleCommand(4, $(this), '우회전', '➡️'); 
            });

            $('#vehicle-stop').click(function() {
                sendVehicleCommand(0, $(this), '정지', '⏹️');
            });

            // 속도 슬라이더 변경 시 현재 방향 명령과 함께 발행
            $('#vehicleMaxSpeedSlider').on('input change', function(event) {
                const speedKmh = Number.parseFloat($(this).val()) || 0;
                const speedMs = speedKmh / 3.6; // km/h를 m/s로 변환
                const roundedSpeedMs = Number(speedMs.toFixed(2));

                // UI는 수동 조작 시 항상 즉시 반영
                updateVehicleSpeedUi(speedKmh, true);

                const isSameSpeed = lastVehicleMaxSpeedMsSent !== null && Math.abs(roundedSpeedMs - lastVehicleMaxSpeedMsSent) < 0.0001;
                const isFinalChange = event.type === 'change';
                if (isSameSpeed && !isFinalChange) {
                    return;
                }
                
                // MQTT로 차량 속도 발행 (m/s 단위)
                const topic = 'vehicle/linear/speed';
                sendMQTTMessage(topic, roundedSpeedMs, 1);
                lastVehicleMaxSpeedMsSent = roundedSpeedMs;

                // 속도 변경 시 현재 방향 명령을 재발행하여 휠 속도 갱신을 강제한다.
                const vehicleButtonSelector = '#vehicle-forward, #vehicle-backward, #vehicle-turn-left, #vehicle-turn-right, #vehicle-stop';
                const selectedButton = $(vehicleButtonSelector).filter('.active').first();
                const selectedButtonId = selectedButton.length ? selectedButton.attr('id') : 'vehicle-stop';
                const selectedCommand = getVehicleCommandByButtonId(selectedButtonId);
                publishWhenConnected('vehicle/operation/command', selectedCommand);
                applyVehicleWheelAnimationByCommand(selectedCommand);
                
                console.log(`[Vehicle Test] 🚀 최고 속도 설정 - ${speedKmh.toFixed(1)} Km/h (${roundedSpeedMs.toFixed(2)} m/s): ${topic} = ${roundedSpeedMs}`);
            });
        });
    </script>

</body>

</html>
