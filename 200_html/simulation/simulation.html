<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulation</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet" />
    <link href="simulation.css?v=20260810-1" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "three-csg-ts": "https://esm.sh/three-csg-ts@3.2.0?external=three",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js",
                "RapierPhysics": "https://cdn.jsdelivr.net/npm/three@0.160/addons/physics/RapierPhysics.js"
            }
        }
    </script>
    <script type="module" src="../urdf/urdfViewer.js?v=20260818-5"></script>
    <script type="module" src="simulation.js?v=20260818-50"></script>
</head>

<body class="bg-body-secondary">
    <div class="container-fluid py-3 simulation-container">
        <div class="d-flex justify-content-end align-items-center mb-2 position-relative">
            <h4 class="mb-0 text-primary fw-bold position-absolute start-50 translate-middle-x simulation-title">
                Simulation</h4>
            <a href="../urdf/urdfViewer.html" class="btn btn-sm btn-outline-primary">URDF Viewer</a>
        </div>
        <div class="row justify-content-center">
            <div class="col-12 col-xxl-10">
                <div class="card shadow border border-primary-subtle rounded-4 overflow-hidden simulation-viewer-card">
                    <div class="card-body p-0">
                        <div class="robot-container urdf-container w-100 rounded-4 overflow-hidden border border-primary border-2"
                            id="robot-container-1" urdf_="/urdf/model/vehicle/vehicle.urdf"
                            urdf="/urdf/model/sw_13/urdf/sw.urdf?v=20260818-2" showAttitude="true" showViewCube="true"
                            showCompass="true" showTransparency="true" wheel-visual-rotation-sign="-1">
                        </div>
                    </div>
                </div>

                <div class="mt-3 mb-0" id="control-panels-row">
                    <div class="row g-3">
                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex flex-column gap-2 px-3 py-3 rounded border border-primary-subtle bg-white"
                                id="wheel-animation-panel">
                                <div class="row g-2">
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">FL</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                id="wheel-speed-rpm-fl" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('fl', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                id="wheel-speed-rpm-value-fl">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">FR</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                id="wheel-speed-rpm-fr" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('fr', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                id="wheel-speed-rpm-value-fr">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">RL</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                id="wheel-speed-rpm-rl" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('rl', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                id="wheel-speed-rpm-value-rl">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">RR</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                id="wheel-speed-rpm-rr" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('rr', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                id="wheel-speed-rpm-value-rr">0 rpm</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex flex-column justify-content-center gap-2 px-3 py-3 rounded border border-primary-subtle bg-white"
                                id="drive-control-panel">
                                <div class="w-100 overflow-auto">
                                    <div class="d-inline-flex flex-nowrap align-items-center gap-2 drive-button-list">
                                        <button type="button" class="btn btn-outline-primary btn-sm"
                                            id="drive-btn-forward"
                                            onclick="setSimulationDriveMode('forward')">전진</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                            id="drive-btn-backward"
                                            onclick="setSimulationDriveMode('backward')">후진</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" id="drive-btn-left"
                                            onclick="setSimulationDriveMode('left')">좌회전</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm"
                                            id="drive-btn-right" onclick="setSimulationDriveMode('right')">우회전</button>
                                        <button type="button" class="btn btn-outline-danger btn-sm" id="drive-btn-stop"
                                            onclick="setSimulationDriveMode('stop')">정지</button>
                                        <button type="button" class="btn btn-outline-warning btn-sm text-nowrap"
                                            id="drive-btn-reset" onclick="resetSimulation()">초기화</button>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-center align-items-center mt-2">
                                    <div
                                        class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light w-100">
                                        <span class="small text-nowrap fw-semibold">속도</span>
                                        <input type="range" class="form-range m-0" id="drive-speed-mps" min="0" max="2"
                                            step="0.1" value="0.1"
                                            oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setSimulationDriveSpeedMps(this.value)">
                                        <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0">
                                            <input type="number"
                                                class="form-control form-control-sm text-end flex-shrink-0"
                                                id="drive-speed-mps-input" min="0" max="2" step="0.1" value="0.1"
                                                aria-label="속도 값" style="width: 5.25rem;">
                                            <span class="small text-nowrap fw-semibold text-start flex-shrink-0"
                                                id="drive-speed-mps-value">m/s</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-center align-items-center mt-2">
                                    <div
                                        class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light w-100">
                                        <span class="small text-nowrap fw-semibold">배속</span>
                                        <input type="range" class="form-range m-0" id="simulation-visual-speed-scale"
                                            min="1" max="7" step="1" value="3"
                                            oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setSimulationVisualSpeed(this.value)">
                                        <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0">
                                            <input type="text"
                                                class="form-control form-control-sm text-end flex-shrink-0"
                                                id="simulation-visual-speed-scale-input" value="1/2" readonly
                                                aria-label="배속 값" style="width: 5.25rem;">
                                            <span class="small text-nowrap fw-semibold text-start flex-shrink-0"
                                                id="simulation-visual-speed-scale-value">x</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex align-items-center justify-content-center px-3 py-3 rounded border border-primary-subtle bg-white"
                                id="ramp-control-panel">
                                <div class="d-flex flex-column gap-2 w-100 align-items-center">
                                    <div class="d-flex align-items-center gap-2">
                                        <span
                                            class="small text-nowrap fw-semibold text-end road-angle-label">Roll</span>
                                        <input type="range" class="form-range m-0" id="road-roll-angle-deg" min="-30"
                                            max="30" step="1" value="0" oninput="setRoadRollAngleDeg(this.value)">
                                        <span class="small text-nowrap fw-semibold road-angle-value"
                                            id="road-roll-angle-deg-value">0°</span>
                                        <button type="button"
                                            class="btn btn-outline-secondary btn-sm text-nowrap flex-shrink-0 small"
                                            id="road-roll-reset" onclick="resetSimulationRoll()">초기화</button>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span
                                            class="small text-nowrap fw-semibold text-end road-angle-label">Pitch</span>
                                        <input type="range" class="form-range m-0" id="road-pitch-angle-deg" min="-30"
                                            max="30" step="1" value="0" oninput="setRoadPitchAngleDeg(this.value)">
                                        <span class="small text-nowrap fw-semibold road-angle-value"
                                            id="road-pitch-angle-deg-value">0°</span>
                                        <button type="button"
                                            class="btn btn-outline-secondary btn-sm text-nowrap flex-shrink-0 small"
                                            id="road-pitch-reset" onclick="resetSimulationPitch()">초기화</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3 mb-0 border border-secondary-subtle" id="simulation-debug-panel" role="status">
                    <div class="card-header py-2 px-3 small fw-semibold text-primary">Simulation Debug</div>
                    <div class="card-body py-2 px-3">
                        <div id="simulation-debug-text" class="small">대기 중...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
