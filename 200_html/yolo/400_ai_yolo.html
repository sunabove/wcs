<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AI YOLO Video Detect</title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		#yolo-drop-zone {
			border: 2px dashed #9aa4b2;
			border-radius: 10px;
			background: #f8fafc;
			padding: 14px;
			text-align: center;
			cursor: pointer;
			transition: all 0.15s ease;
			color: #334155;
		}

		#yolo-drop-zone.drag-active {
			border-color: #0d6efd;
			background: #e8f1ff;
			box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.2);
		}

		#yolo-selected-file {
			font-size: 0.875rem;
			color: #475569;
		}

		#yolo-uploaded-list {
			display: flex;
			flex-direction: row;
			flex-wrap: nowrap;
			gap: 0.5rem;
			align-items: stretch;
			overflow-x: auto;
			overflow-y: hidden;
			padding-bottom: 0.25rem;
			white-space: nowrap;
		}

		#yolo-uploaded-list .list-group-item {
			min-width: 118px;
			max-width: 118px;
			padding: 0.4rem;
		}

		.yolo-uploaded-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.35rem;
		}

		.yolo-uploaded-thumb {
			width: 100%;
			height: 64px;
			object-fit: cover;
			border-radius: 0.35rem;
			border: 1px solid #dee2e6;
			background: #f1f5f9;
			flex-shrink: 0;
		}

		.yolo-uploaded-meta {
			width: 100%;
			min-width: 0;
			line-height: 1.2;
			text-align: center;
		}

		.yolo-video-wrap {
			text-align: center;
		}

		.yolo-video-player {
			width: auto;
			height: auto;
			max-width: 100%;
			max-height: 70vh;
			display: inline-block;
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<header class="p-2 text-bg-dark fs-5">
	<div class="container d-flex justify-content-between align-items-center">
		<div>YOLO Video Detection</div>
		<div class="d-flex gap-2">
			<a href="/road/300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
			<a href="/sam2/500_ai_sam2.html" class="btn btn-outline-light btn-sm">SAM2</a>
		</div>
	</div>
</header>

<main class="container my-4">
	<div class="card shadow-sm mb-3">
		<div class="card-header">
			<h5 class="mb-0">입력 옵션</h5>
		</div>
		<div class="card-body">
			<div class="row g-3 align-items-start">
				<div class="col-md-4">
					<label for="yolo-video-file" class="form-label">동영상 파일</label>
					<input id="yolo-video-file" class="form-control mb-2" type="file" accept="video/*">
					<div id="yolo-drop-zone" role="button" tabindex="0" aria-label="동영상 드래그 업로드 영역">
						<div class="fw-semibold">동영상을 여기로 드래그하세요</div>
						<div class="small text-muted mt-1">또는 클릭해서 파일 선택</div>
					</div>
					<div id="yolo-selected-file" class="small mt-2 text-muted">선택된 파일 없음</div>
				</div>
				<div class="col-md-8">
					<div class="small fw-semibold text-secondary mb-1">업로드한 동영상</div>
					<ul id="yolo-uploaded-list" class="list-group list-group-sm">
						<li id="yolo-uploaded-empty" class="list-group-item small text-muted">업로드 이력 없음</li>
					</ul>
				</div>
			</div>

			<div class="row g-3 mt-1 align-items-end">
				<div class="col-md-5">
					<label for="yolo-conf" class="form-label d-flex justify-content-between align-items-center">
						<span>Conf</span>
						<span id="yolo-conf-value" class="badge text-bg-secondary">0.25</span>
					</label>
					<input id="yolo-conf" class="form-range" type="range" min="0" max="1" step="0.01" value="0.25">
				</div>
				<div class="col-md-5">
					<label for="yolo-iou" class="form-label d-flex justify-content-between align-items-center">
						<span>IoU</span>
						<span id="yolo-iou-value" class="badge text-bg-secondary">0.45</span>
					</label>
					<input id="yolo-iou" class="form-range" type="range" min="0" max="1" step="0.01" value="0.45">
				</div>
				<div class="col-md-2 d-grid">
					<button id="yolo-detect-btn" class="btn btn-primary">검출 시작</button>
				</div>
			</div>

			<div id="yolo-status" class="alert alert-secondary mt-3 mb-0">대기 중</div>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-header d-flex justify-content-between align-items-center">
			<h5 class="mb-0">출력</h5>
			<div class="form-check form-switch mb-0 ms-2">
				<input class="form-check-input" type="checkbox" role="switch" id="yolo-loop-toggle">
				<label class="form-check-label small" for="yolo-loop-toggle">반복 재생</label>
			</div>
		</div>
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center mb-1">
				<ul class="nav nav-tabs" id="yolo-video-tabs" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" id="yolo-input-tab" data-bs-toggle="tab" data-bs-target="#yolo-input-pane" type="button" role="tab" aria-controls="yolo-input-pane" aria-selected="true">📼 원본 영상</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="yolo-output-tab" data-bs-toggle="tab" data-bs-target="#yolo-output-pane" type="button" role="tab" aria-controls="yolo-output-pane" aria-selected="false">🎯 검출 영상</button>
					</li>
				</ul>
			</div>
			<div class="tab-content border border-top-0 rounded-bottom p-3 bg-white" id="yolo-video-tab-content">
				<div class="tab-pane fade show active" id="yolo-input-pane" role="tabpanel" aria-labelledby="yolo-input-tab" tabindex="0">
					<div class="yolo-video-wrap">
						<video id="yolo-input-video" class="yolo-video-player border rounded" controls playsinline></video>
					</div>
				</div>
				<div class="tab-pane fade" id="yolo-output-pane" role="tabpanel" aria-labelledby="yolo-output-tab" tabindex="0">
					<div class="yolo-video-wrap">
						<video id="yolo-output-video" class="yolo-video-player border rounded" controls playsinline></video>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>

<script src="400_ai_yolo.js" defer></script>
</body>
</html>
