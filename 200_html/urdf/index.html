<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URDF Viewer</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    
</head>

<body class="bg-light" style="margin: 0; padding: 0; font-family: Arial, sans-serif;">
    <div class="container-fluid py-3" style="padding-left: 20px; padding-right: 20px;">
        <div class="row justify-content-center">
            <div class="col-12 col-xxl-10">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="robot-container urdf-container w-100 rounded-4 overflow-hidden border border-dark border-2" 
                            id="robot-container-1" 
                            urdf="/urdf/vehicle/vehicle.urdf"
                            cameraPosition="-0.034, -1.086, 1.127"
                            showAttitude="true"
                        style="position: relative; min-height: 70vh;">
                            <span class="badge text-bg-dark" style="position: absolute; top: 12px; left: 12px; z-index: 10;">URDF View</span>
                        </div>
                    </div>
                </div>

                <div class="alert alert-dark d-flex justify-content-between align-items-center mt-3 mb-0 py-2 px-3" id="camera-angle-panel" 
                    role="status" style="width: fit-content; margin-left: auto; margin-right: auto; min-width: 280px; pointer-events: none;">
                    <strong class="me-3">Camera : </strong>
                    <span id="camera-pos-text" class="text-center" style="white-space: pre;">0.000, 0.000, 0.000</span>
                </div>

                <div class="mt-3 mb-0" id="control-panels-row">
                    <div class="row g-3">
                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex flex-column gap-2 px-3 py-3 rounded border bg-white" id="wheel-animation-panel">
                                <div class="row g-2">
                                    <div class="col-12 col-md-6">
                                        <div class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold" style="min-width: 28px;">FL</span>
                                            <input type="range" class="form-range m-0" id="wheel-speed-rpm-fl" min="0" max="120" step="10" value="0" oninput="setWheelAnimationByKey('fl', this.value)">
                                            <span class="small text-nowrap fw-semibold" id="wheel-speed-rpm-value-fl" style="min-width: 56px; text-align: right;">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold" style="min-width: 28px;">FR</span>
                                            <input type="range" class="form-range m-0" id="wheel-speed-rpm-fr" min="0" max="120" step="10" value="0" oninput="setWheelAnimationByKey('fr', this.value)">
                                            <span class="small text-nowrap fw-semibold" id="wheel-speed-rpm-value-fr" style="min-width: 56px; text-align: right;">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold" style="min-width: 28px;">RL</span>
                                            <input type="range" class="form-range m-0" id="wheel-speed-rpm-rl" min="0" max="120" step="10" value="0" oninput="setWheelAnimationByKey('rl', this.value)">
                                            <span class="small text-nowrap fw-semibold" id="wheel-speed-rpm-value-rl" style="min-width: 56px; text-align: right;">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold" style="min-width: 28px;">RR</span>
                                            <input type="range" class="form-range m-0" id="wheel-speed-rpm-rr" min="0" max="120" step="10" value="0" oninput="setWheelAnimationByKey('rr', this.value)">
                                            <span class="small text-nowrap fw-semibold" id="wheel-speed-rpm-value-rr" style="min-width: 56px; text-align: right;">0 rpm</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex flex-column justify-content-center gap-2 px-3 py-3 rounded border bg-white" id="drive-control-panel">
                                <div class="d-flex justify-content-center align-items-center flex-wrap gap-2">
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="drive-btn-forward" onclick="setDriveMode('forward')">전진</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="drive-btn-backward" onclick="setDriveMode('backward')">후진</button>
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="drive-btn-left" onclick="setDriveMode('left')">좌회전</button>
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="drive-btn-right" onclick="setDriveMode('right')">우회전</button>
                                    <button type="button" class="btn btn-outline-danger btn-sm" id="drive-btn-stop" onclick="setDriveMode('stop')">정지</button>
                                </div>
                                <div class="d-flex justify-content-center align-items-center mt-2">
                                    <div class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light w-100">
                                        <span class="small text-nowrap fw-semibold">속도</span>
                                        <input type="range" class="form-range m-0" id="drive-speed-kmh" min="0" max="30" step="1" value="0" oninput="$('#drive-speed-kmh-value').text(this.value + ' km/h'); setDriveSpeedKmh(this.value)">
                                        <span class="small text-nowrap fw-semibold" id="drive-speed-kmh-value" style="min-width: 60px; text-align: right;">0 km/h</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 col-lg-4">
                            <div class="h-100 d-flex align-items-center justify-content-center px-3 py-3 rounded border bg-white" id="ramp-control-panel">
                                <div class="d-flex flex-column gap-2 w-100 align-items-center">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="small text-nowrap fw-semibold text-end" style="width: 60px;">Roll</span>
                                        <input
                                            type="number"
                                            class="form-control form-control-sm text-end"
                                            id="road-roll-angle-deg"
                                            min="-30"
                                            max="30"
                                            step="1"
                                            value="0"
                                            style="width: 88px;"
                                            oninput="setRoadRollAngleDeg(this.value)"
                                        >
                                        <span class="small text-nowrap fw-semibold" id="road-roll-angle-deg-value" style="min-width: 40px; text-align: right;">0°</span>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="small text-nowrap fw-semibold text-end" style="width: 60px;">Pitch</span>
                                        <input
                                            type="number"
                                            class="form-control form-control-sm text-end"
                                            id="road-pitch-angle-deg"
                                            min="-30"
                                            max="30"
                                            step="1"
                                            value="0"
                                            style="width: 88px;"
                                            oninput="setRoadPitchAngleDeg(this.value)"
                                        >
                                        <span class="small text-nowrap fw-semibold" id="road-pitch-angle-deg-value" style="min-width: 40px; text-align: right;">0°</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
            }
        }
    </script>
    <script type="module" src="urdf.js"></script>
</body>

</html>
