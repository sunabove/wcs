<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rapier Physics Simulation</title>

	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
			"three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
			"RapierPhysics": "https://cdn.jsdelivr.net/npm/three@0.160/addons/physics/RapierPhysics.js",
			"RAPIER": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
		}
	}
	</script>
</head>

<body class="bg-dark text-light">
	<main class="container-fluid py-2">
		<div class="row g-2 align-items-center mb-2">
			<div class="col-12 col-lg-7">
				<div class="d-flex flex-wrap gap-2">
					<button id="spawn-box" type="button" class="btn btn-sm btn-primary">Box 추가</button>
					<button id="spawn-ball" type="button" class="btn btn-sm btn-info text-dark">Ball 추가</button>
					<button id="reset-scene" type="button" class="btn btn-sm btn-outline-light">초기화</button>
					<button id="toggle-gravity" type="button" class="btn btn-sm btn-warning text-dark">중력 OFF</button>
				</div>
			</div>
			<div class="col-12 col-lg-5">
				<div class="d-flex justify-content-lg-end align-items-center gap-2 flex-wrap mb-1">
					<div class="small text-secondary text-lg-end" id="sim-stats">RigidBodies: 0 | Gravity: ON</div>
					<a href="./urdfViewer.html" class="btn btn-sm btn-outline-light">URDF Viewer</a>
				</div>
			</div>
		</div>

		<div id="sim-container" class="border border-secondary rounded" style="width:100%; height:calc(100vh - 92px); min-height:420px;"></div>
	</main>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
		import RAPIER from 'RAPIER';

		const container = document.getElementById('sim-container');
		const statsLabel = document.getElementById('sim-stats');
		const spawnBoxButton = document.getElementById('spawn-box');
		const spawnBallButton = document.getElementById('spawn-ball');
		const resetButton = document.getElementById('reset-scene');
		const gravityButton = document.getElementById('toggle-gravity');

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x101418);
		scene.fog = new THREE.Fog(0x101418, 35, 120);

		const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 300);
		camera.position.set(12, 12, 18);

		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
		renderer.shadowMap.enabled = true;
		renderer.shadowMap.type = THREE.PCFSoftShadowMap;
		container.appendChild(renderer.domElement);

		const controls = new OrbitControls(camera, renderer.domElement);
		controls.enableDamping = true;
		controls.dampingFactor = 0.07;
		controls.target.set(0, 2, 0);

		const ambient = new THREE.AmbientLight(0xffffff, 0.35);
		scene.add(ambient);

		const sun = new THREE.DirectionalLight(0xffffff, 1.05);
		sun.position.set(18, 26, 10);
		sun.castShadow = true;
		sun.shadow.mapSize.set(2048, 2048);
		sun.shadow.camera.near = 1;
		sun.shadow.camera.far = 100;
		sun.shadow.camera.left = -30;
		sun.shadow.camera.right = 30;
		sun.shadow.camera.top = 30;
		sun.shadow.camera.bottom = -30;
		scene.add(sun);

		const grid = new THREE.GridHelper(80, 80, 0x3b3f45, 0x2b2f35);
		grid.position.y = 0.001;
		scene.add(grid);

		const groundGeometry = new THREE.BoxGeometry(40, 1, 40);
		const groundMaterial = new THREE.MeshStandardMaterial({
			color: 0x6f7784,
			metalness: 0.1,
			roughness: 0.85,
		});
		const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
		groundMesh.position.set(0, -0.5, 0);
		groundMesh.receiveShadow = true;
		scene.add(groundMesh);

		function resizeRenderer() {
			const width = Math.max(320, container.clientWidth || window.innerWidth);
			const height = Math.max(260, container.clientHeight || window.innerHeight);
			renderer.setSize(width, height, false);
			camera.aspect = width / height;
			camera.updateProjectionMatrix();
		}

		window.addEventListener('resize', resizeRenderer);
		resizeRenderer();

		await RAPIER.init();

		let gravityEnabled = true;
		let world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
		const rigidEntries = [];
		const clock = new THREE.Clock();

		const staticGroundBody = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.5, 0));
		const groundColliderDesc = RAPIER.ColliderDesc.cuboid(20, 0.5, 20)
			.setFriction(0.8)
			.setRestitution(0.05);
		world.createCollider(groundColliderDesc, staticGroundBody);

		function randomInRange(min, max) {
			return min + (Math.random() * (max - min));
		}

		function createDynamicRigidBody(mesh, colliderDesc, position) {
			mesh.castShadow = true;
			mesh.receiveShadow = true;
			mesh.position.copy(position);
			scene.add(mesh);

			const rbDesc = RAPIER.RigidBodyDesc.dynamic()
				.setTranslation(position.x, position.y, position.z)
				.setLinvel(0, 0, 0)
				.setAngvel(0, 0, 0);

			const rigidBody = world.createRigidBody(rbDesc);
			world.createCollider(colliderDesc, rigidBody);

			rigidEntries.push({ mesh, rigidBody });
			updateStats();
		}

		function spawnBox() {
			const sx = randomInRange(0.45, 1.1);
			const sy = randomInRange(0.45, 1.1);
			const sz = randomInRange(0.45, 1.1);

			const mesh = new THREE.Mesh(
				new THREE.BoxGeometry(sx, sy, sz),
				new THREE.MeshStandardMaterial({
					color: new THREE.Color().setHSL(Math.random(), 0.65, 0.56),
					metalness: 0.1,
					roughness: 0.65,
				})
			);

			const collider = RAPIER.ColliderDesc.cuboid(sx / 2, sy / 2, sz / 2)
				.setDensity(1.0)
				.setFriction(0.62)
				.setRestitution(0.22);

			createDynamicRigidBody(
				mesh,
				collider,
				new THREE.Vector3(randomInRange(-6, 6), randomInRange(8, 16), randomInRange(-6, 6))
			);
		}

		function spawnBall() {
			const radius = randomInRange(0.28, 0.78);
			const mesh = new THREE.Mesh(
				new THREE.SphereGeometry(radius, 24, 16),
				new THREE.MeshStandardMaterial({
					color: new THREE.Color().setHSL(Math.random(), 0.72, 0.58),
					metalness: 0.18,
					roughness: 0.42,
				})
			);

			const collider = RAPIER.ColliderDesc.ball(radius)
				.setDensity(0.9)
				.setFriction(0.5)
				.setRestitution(0.65);

			createDynamicRigidBody(
				mesh,
				collider,
				new THREE.Vector3(randomInRange(-6, 6), randomInRange(8, 16), randomInRange(-6, 6))
			);
		}

		function destroyRigidBodies() {
			for (const entry of rigidEntries) {
				world.removeRigidBody(entry.rigidBody);
				scene.remove(entry.mesh);
				entry.mesh.geometry.dispose();
				if (Array.isArray(entry.mesh.material)) {
					entry.mesh.material.forEach((material) => material.dispose());
				} else if (entry.mesh.material) {
					entry.mesh.material.dispose();
				}
			}
			rigidEntries.length = 0;
			updateStats();
		}

		function resetSimulation() {
			destroyRigidBodies();
			for (let i = 0; i < 6; i += 1) {
				spawnBox();
			}
			for (let i = 0; i < 4; i += 1) {
				spawnBall();
			}
		}

		function updateStats() {
			if (!statsLabel) {
				return;
			}
			statsLabel.textContent = `RigidBodies: ${rigidEntries.length} | Gravity: ${gravityEnabled ? 'ON' : 'OFF'}`;
		}

		function setGravityEnabled(enabled) {
			gravityEnabled = Boolean(enabled);
			world.gravity = gravityEnabled
				? new RAPIER.Vector3(0, -9.81, 0)
				: new RAPIER.Vector3(0, 0, 0);
			if (gravityButton) {
				gravityButton.textContent = gravityEnabled ? '중력 OFF' : '중력 ON';
			}
			updateStats();
		}

		spawnBoxButton?.addEventListener('click', spawnBox);
		spawnBallButton?.addEventListener('click', spawnBall);
		resetButton?.addEventListener('click', resetSimulation);
		gravityButton?.addEventListener('click', () => setGravityEnabled(!gravityEnabled));

		resetSimulation();
		setGravityEnabled(true);

		function animate() {
			const delta = Math.min(clock.getDelta(), 1 / 30);
			world.timestep = delta;
			world.step();

			for (const entry of rigidEntries) {
				const translation = entry.rigidBody.translation();
				const rotation = entry.rigidBody.rotation();

				entry.mesh.position.set(translation.x, translation.y, translation.z);
				entry.mesh.quaternion.set(rotation.x, rotation.y, rotation.z, rotation.w);

				if (translation.y < -30) {
					entry.rigidBody.setTranslation(
						{
							x: randomInRange(-5, 5),
							y: randomInRange(10, 16),
							z: randomInRange(-5, 5),
						},
						true
					);
					entry.rigidBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
					entry.rigidBody.setAngvel({ x: 0, y: 0, z: 0 }, true);
				}
			}

			controls.update();
			renderer.render(scene, camera);
			requestAnimationFrame(animate);
		}

		animate();
	</script>
</body>
</html>
