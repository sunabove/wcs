<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulation</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet" />
    <link href="simulation.css?v=20260820-5" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "three-csg-ts": "https://esm.sh/three-csg-ts@3.2.0?external=three",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js",
                "RapierPhysics": "https://cdn.jsdelivr.net/npm/three@0.160/addons/physics/RapierPhysics.js"
            }
        }
    </script>
    <script type="module" src="../urdf/urdfViewer.js?v=20260819-1"></script>
    <script type="module" src="simulation.js?v=20260820-71"></script>
</head>

<body class="bg-body-secondary" style="margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;">
    <div class="container-fluid py-3" style="padding-right: 20px; padding-left: 20px;">
        <div class="d-flex justify-content-end align-items-center mb-2 position-relative">
            <h4 class="mb-0 text-primary fw-bold position-absolute start-50 translate-middle-x"
                style="letter-spacing: 0.03em;">
                Simulation</h4>
            <a href="../urdf/urdfViewer.html" class="btn btn-sm btn-outline-primary">URDF Viewer</a>
        </div>
        <div class="row justify-content-center">

            <div class="card shadow p-2 border border-primary-subtle overflow-hidden simulation-viewer-card">
                <div class="card-body p-0">
                    <div class="robot-container urdf-container w-100 rounded-4 overflow-hidden border border-primary border-1"
                        id="robot-container-1" urdf="/urdf/model/sw_14/urdf/sw.urdf" showAttitude="true"
                        style="aspect-ratio: 16 / 9; height: auto; min-height: 260px; max-height: 70vh;"
                        showViewCube="true" showCompass="true" showTransparency="true">
                    </div>
                </div>
            </div>

            <table class="table w-100 mb-0 mt-2 p-2 " id="control-panels-row">
                <colgroup>
                    <col width="30%">
                    <col>
                    <col width="20%">
                </colgroup>
                <tbody>
                    <tr>
                        <td class="px-0 align-top">
                            <div class="h-100 d-flex flex-column gap-2 px-2 py-2 rounded border border-primary-subtle bg-white"
                                id="wheel-animation-panel">
                                <div class="row h-100 g-2">
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-2 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">FL</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                style="--slider-percent: 50%; flex: 1 1 0; min-width: 0; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                id="wheel-speed-rpm-fl" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('fl', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                style="flex: 0 0 4.5rem; width: 4.5rem; overflow: hidden; text-align: right; text-overflow: ellipsis;"
                                                id="wheel-speed-rpm-value-fl">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-2 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">FR</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                style="--slider-percent: 50%; flex: 1 1 0; min-width: 0; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                id="wheel-speed-rpm-fr" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('fr', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                style="flex: 0 0 4.5rem; width: 4.5rem; overflow: hidden; text-align: right; text-overflow: ellipsis;"
                                                id="wheel-speed-rpm-value-fr">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-2 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">RL</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                style="--slider-percent: 50%; flex: 1 1 0; min-width: 0; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                id="wheel-speed-rpm-rl" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('rl', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                style="flex: 0 0 4.5rem; width: 4.5rem; overflow: hidden; text-align: right; text-overflow: ellipsis;"
                                                id="wheel-speed-rpm-value-rl">0 rpm</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div
                                            class="d-flex align-items-center gap-2 px-2 py-2 rounded border bg-light h-100">
                                            <span class="small text-nowrap fw-semibold wheel-position-label">RR</span>
                                            <input type="range" class="form-range wheel-rpm-slider m-0"
                                                style="--slider-percent: 50%; flex: 1 1 0; min-width: 0; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                id="wheel-speed-rpm-rr" min="-120" max="120" step="10" value="0"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setWheelAnimationByKey('rr', this.value)">
                                            <span class="small text-nowrap fw-semibold wheel-rpm-value"
                                                style="flex: 0 0 4.5rem; width: 4.5rem; overflow: hidden; text-align: right; text-overflow: ellipsis;"
                                                id="wheel-speed-rpm-value-rr">0 rpm</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>

                        <td class="px-2 align-top">
                            <div class="h-100 d-flex flex-column justify-content-center gap-2 px-3 py-3 rounded border border-primary-subtle bg-white"
                                id="drive-control-panel">
                                <div class="d-flex justify-content-center w-100 overflow-auto">
                                    <div class="d-inline-flex flex-nowrap align-items-center gap-2"
                                        style="min-width: max-content; white-space: nowrap;">
                                        <button type="button" class="btn btn-outline-primary btn-sm"
                                            id="drive-btn-forward"
                                            onclick="setSimulationDriveMode('forward')">전진</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                            id="drive-btn-backward"
                                            onclick="setSimulationDriveMode('backward')">후진</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" id="drive-btn-left"
                                            onclick="setSimulationDriveMode('left')">좌회전</button>
                                        <button type="button" class="btn btn-outline-primary btn-sm"
                                            id="drive-btn-right" onclick="setSimulationDriveMode('right')">우회전</button>
                                        <button type="button" class="btn btn-outline-danger btn-sm" id="drive-btn-stop"
                                            onclick="stopSimulationWheelRotation()">정지</button>
                                        <button type="button" class="btn btn-outline-warning btn-sm text-nowrap"
                                            id="drive-btn-reset" onclick="resetSimulation()">초기화</button>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-center align-items-center mt-2">
                                    <div
                                        class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light w-100">
                                        <span class="small text-nowrap fw-semibold">속도</span>
                                        <div class="flex-grow-1 position-relative" style="padding-top: 0.45rem;">
                                            <div class="slider-tick-scale-speed" aria-hidden="true"
                                                style="position: absolute; top: 0; right: 0.5rem; left: 0.5rem; height: 0.3rem; pointer-events: none;">
                                            </div>
                                            <input type="range" class="form-range m-0" id="drive-speed-mps"
                                                style="--slider-percent: 10%; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                min="0.1" max="2" step="0.1" value="0.1"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setSimulationDriveSpeedMps(this.value)">
                                        </div>
                                        <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0">
                                            <input type="number"
                                                class="form-control form-control-sm text-end flex-shrink-0"
                                                id="drive-speed-mps-input" min="0.1" max="2" step="0.1" value="0.1"
                                                aria-label="속도 값" style="width: 5.25rem;">
                                            <span class="small text-nowrap fw-semibold text-start flex-shrink-0"
                                                id="drive-speed-mps-value"
                                                style="min-width: 40px; text-align: right;">m/s</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-center align-items-center mt-1">
                                    <div
                                        class="d-flex align-items-center gap-2 px-3 py-2 rounded border bg-light w-100">
                                        <span class="small text-nowrap fw-semibold">배속</span>
                                        <div class="flex-grow-1 position-relative" style="padding-top: 0.45rem;">
                                            <div class="slider-tick-scale-visual" aria-hidden="true"
                                                style="position: absolute; top: 0; right: 0.5rem; left: 0.5rem; height: 0.3rem; pointer-events: none;">
                                            </div>
                                            <input type="range" class="form-range m-0"
                                                style="--slider-percent: 27.2727%; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                id="simulation-visual-speed-scale" min="1" max="7" step="1" value="3"
                                                oninput="this.style.setProperty('--slider-percent', (((this.value - this.min) * 100) / (this.max - this.min)) + '%'); setSimulationVisualSpeed(this.value)">
                                        </div>
                                        <div class="d-flex align-items-center gap-2 ms-auto flex-shrink-0">
                                            <input type="text"
                                                class="form-control form-control-sm text-end flex-shrink-0"
                                                id="simulation-visual-speed-scale-input" value="1/2" readonly
                                                aria-label="배속 값" style="width: 5.25rem;">
                                            <span class="small text-nowrap fw-semibold text-start flex-shrink-0"
                                                id="simulation-visual-speed-scale-value"
                                                style="min-width: 40px; text-align: right;">x</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>

                        <td class="px-0 align-top">
                            <div class="h-100 d-flex align-items-start justify-content-center px-2 py-2 rounded border border-primary-subtle bg-white"
                                id="ramp-control-panel">
                                <table class="w-100" style="table-layout: fixed;">
                                    <colgroup>
                                        <col style="width: 50px;">
                                        <col>
                                        <col style="width: 2.5rem;">
                                        <col style="width: 4.75rem;">
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <td
                                                class="ps-2 py-2 align-middle border border-end-0 rounded-start bg-light small text-nowrap fw-semibold">
                                                Roll</td>
                                            <td class="px-2 py-2 align-middle border-top border-bottom bg-light">
                                                <input type="range" class="form-range wheel-rpm-slider m-0"
                                                    style="--slider-percent: 50%; width: 100%; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                    id="road-roll-angle-deg" min="-30" max="30" step="1" value="0"
                                                    oninput="setRoadRollAngleDeg(this.value)">
                                            </td>
                                            <td class="py-2 align-middle border-top border-bottom bg-light small text-nowrap fw-semibold text-end"
                                                id="road-roll-angle-deg-value">0°</td>
                                            <td
                                                class="px-2 py-0 align-middle border border-start-0 rounded-end bg-light">
                                                <button type="button"
                                                    class="w-100 btn btn-outline-secondary btn-sm text-nowrap small"
                                                    id="road-roll-reset" onclick="resetSimulationRoll()">초기화</button>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td
                                                class="ps-2 py-2 align-middle border border-end-0 rounded-start bg-light small text-nowrap fw-semibold">
                                                Pitch</td>
                                            <td class="px-2 py-2 align-middle border-top border-bottom bg-light">
                                                <input type="range" class="form-range wheel-rpm-slider m-0"
                                                    style="--slider-percent: 50%; width: 100%; height: 0.5rem; border-radius: 999px; appearance: none; -webkit-appearance: none;"
                                                    id="road-pitch-angle-deg" min="-30" max="30" step="1" value="0"
                                                    oninput="setRoadPitchAngleDeg(this.value)">
                                            </td>
                                            <td class="py-2 align-middle border-top border-bottom bg-light small text-nowrap fw-semibold text-end"
                                                id="road-pitch-angle-deg-value">0°</td>
                                            <td
                                                class="px-2 py-0 align-middle border border-start-0 rounded-end bg-light">
                                                <button type="button"
                                                    class="w-100 btn btn-outline-secondary btn-sm text-nowrap small"
                                                    id="road-pitch-reset" onclick="resetSimulationPitch()">초기화</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="card mt-3 mb-0 border border-secondary-subtle" id="simulation-debug-panel" role="status"
                style="display: none; font-family: Consolas, 'Courier New', monospace;">
                <div class="card-header py-2 px-3 small fw-semibold text-primary">Simulation Debug</div>
                <div class="card-body py-2 px-3">
                    <div id="simulation-debug-text" class="small"
                        style="word-break: break-word; white-space: pre-wrap;">대기 중...</div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
