<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> YOLO Detectection </title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<style>
		#yolo-drop-zone.drag-active {
			border-color: #0d6efd;
			background: #e8f1ff;
			box-shadow: inset 0 0 0 1px rgba(13, 110, 253, 0.2);
		}

		#yolo-drop-zone.file-selected {
			border-color: #198754;
			background: #eaf7ef;
			box-shadow: inset 0 0 0 1px rgba(25, 135, 84, 0.2);
		}

		#yolo-uploaded-list .list-group-item {
			min-width: 118px;
			max-width: 118px;
			padding: 0.4rem;
		}

		.yolo-uploaded-item {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.35rem;
		}

		.yolo-uploaded-thumb {
			width: 100%;
			height: 64px;
			object-fit: cover;
			border-radius: 0.35rem;
			border: 1px solid #dee2e6;
			background: #f1f5f9;
			flex-shrink: 0;
		}

		.yolo-uploaded-meta {
			width: 100%;
			min-width: 0;
			line-height: 1.2;
			text-align: center;
		}

	</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<header class="p-2 text-bg-dark fs-5">
	<div class="container d-flex justify-content-between align-items-center">
		<div>YOLO Video Detection</div>
		<div class="d-flex gap-2">
			<a href="/road/300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
			<a href="/sam2/500_ai_sam2.html" class="btn btn-outline-light btn-sm">SAM2</a>
		</div>
	</div>
</header>

<main class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header">
			<h5 class="mb-0">YOLO 객체 검출</h5>
		</div>
		<div class="card-body p-2">
			<div class="table-responsive">
				<table class="table table-bordered align-middle mb-0">
					<colgroup>
						<col style="width: 120px;">
							<col style="width: 70%;">
							<col style="width: 30%;">
					</colgroup>
					<tbody>
						<tr>
							<th scope="row" class="text-center">입력</th>
							<td colspan="2">
								<ul class="nav nav-tabs" id="yolo-input-source-tabs" role="tablist">
									<li class="nav-item" role="presentation">
										<button class="nav-link active text-secondary" id="yolo-file-source-tab" data-bs-toggle="tab" data-bs-target="#yolo-file-source-pane" type="button" role="tab" aria-controls="yolo-file-source-pane" aria-selected="true">
											<i class="bi bi-film me-1" aria-hidden="true"></i>
											&nbsp; 동영상 파일
										</button>
									</li>
									<li class="nav-item" role="presentation">
										<button class="nav-link text-secondary" id="yolo-uploaded-source-tab" data-bs-toggle="tab" data-bs-target="#yolo-uploaded-source-pane" type="button" role="tab" aria-controls="yolo-uploaded-source-pane" aria-selected="false">
											<i class="bi bi-upload me-1" aria-hidden="true"></i>
											&nbsp; 업로드 동영상
										</button>
									</li>
								</ul>
								<input id="yolo-video-file" class="d-none" type="file" accept="video/*">
								<div class="tab-content border border-top-0 rounded-bottom p-2 bg-white">
									<div class="tab-pane fade show active" id="yolo-file-source-pane" role="tabpanel" aria-labelledby="yolo-file-source-tab" tabindex="0">
										<div class="d-flex align-items-stretch gap-2">
											<div id="yolo-drop-zone" class="border border-2 rounded-3 bg-light p-3 text-center text-secondary flex-grow-1" style="border-style: dashed; cursor: pointer; transition: all 0.15s ease; background: #f8fafc; color: #334155;" role="button" tabindex="0" aria-label="동영상 드래그 업로드 영역">
												<div class="fw-semibold">동영상을 여기로 드래그하세요</div>
												<div id="yolo-selected-file" class="form-text mt-1">또는 클릭해서 파일 선택</div>
											</div>
											<div class="d-flex align-items-center border rounded p-2 bg-white ">
												<button id="yolo-upload-button" type="button" class="btn btn-outline-primary px-3 text-nowrap" disabled>동영상 업로드</button>
											</div>
										</div>
									</div>
									<div class="tab-pane fade" id="yolo-uploaded-source-pane" role="tabpanel" aria-labelledby="yolo-uploaded-source-tab" tabindex="0">
										<ul id="yolo-uploaded-list" class="list-group list-group-sm d-flex flex-row flex-nowrap gap-2 align-items-stretch overflow-auto pb-1 mb-0" style="white-space: nowrap;">
											<li id="yolo-uploaded-empty" class="list-group-item small text-muted">업로드 이력 없음</li>
										</ul>
									</div>
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center">모델</th>
							<td colspan="2">
								<ul class="nav nav-tabs" id="yolo-model-tabs" role="tablist"></ul>
								<div class="tab-content border border-top-0 rounded-bottom px-2 py-2 bg-white" id="yolo-model-tab-content">
									<div id="yolo-model-pane-template" class="border rounded p-3 h-100 bg-white">
											<div class="d-flex flex-wrap gap-1 align-items-center" data-role="model-badges">
												<span class="badge text-bg-primary text-break" data-role="file-name" style="font-family: inherit; font-size: inherit;"></span>
												<span class="badge text-bg-secondary" data-role="model-type" style="font-family: inherit; font-size: inherit;"></span>
												<span class="badge text-bg-secondary" data-role="class-count" style="font-family: inherit; font-size: inherit;"></span>
												<span class="d-inline-flex flex-wrap gap-1 align-items-center" data-role="class-list" style="min-width: 0;"></span>
											</div>
									</div> 
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center">옵션</th>
							<td colspan="2">
								<div class="row g-3 align-items-stretch">
									<div class="col-lg-5 px-2 ">
										<div class="border rounded p-2 bg-white h-100 d-flex align-items-center">
											<div class="d-flex align-items-center gap-2 w-100">
												<label for="yolo-conf" class="form-label mb-0 small fw-semibold">Conf</label>
												<input id="yolo-conf" class="form-range flex-grow-1 mb-0" type="range" min="0" max="1" step="0.01" value="0.25">
												<span id="yolo-conf-value" class="badge text-bg-secondary">0.25</span>
											</div>
										</div>
									</div>
									<div class="col-lg-5 px-2 ">
										<div class="border rounded p-2 bg-white h-100 d-flex align-items-center">
											<div class="d-flex align-items-center gap-2 w-100">
												<label for="yolo-iou" class="form-label mb-0 small fw-semibold">IoU</label>
												<input id="yolo-iou" class="form-range flex-grow-1 mb-0" type="range" min="0" max="1" step="0.01" value="0.45">
												<span id="yolo-iou-value" class="badge text-bg-secondary">0.45</span>
											</div>
										</div>
									</div>
									<div class="col-lg-2 px-2 d-grid">
										<div class="border rounded p-2 bg-white h-100 d-grid">
											<button id="yolo-detect-btn" class="btn btn-primary h-100 w-100">검출 시작</button>
										</div>
									</div>
								</div> 
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center">상태</th>
							<td>
								<div id="yolo-status" class="alert alert-secondary mb-0 py-2 px-3 small rounded-2" style="line-height: 1.25;">
									<span id="yolo-status-text">대기 중</span>
								</div>
							</td>
							<td class="py-0">
									<div id="yolo-upload-progress-wrap" class="d-none alert alert-secondary mb-0 py-2 px-3 small rounded-2 w-100 h-100 d-flex align-items-stretch" style="line-height: 1.25;">
										<div class="progress position-relative w-100 h-100" role="progressbar" aria-label="동영상 작업 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="min-height: 42px;">
										<div id="yolo-upload-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%;"></div>
											<span id="yolo-upload-progress-label" class="position-absolute top-50 start-50 translate-middle fs-5 fw-bold text-dark" style="text-shadow: 0 0 2px rgba(255, 255, 255, 0.9);">0%</span>
									</div>
								</div>
							</td>
						</tr>
						<tr>
							<th scope="row" class="text-center">출력</th>
							<td colspan="2">
								<div class="d-flex justify-content-between align-items-center mb-1">
									<ul class="nav nav-tabs" id="yolo-video-tabs" role="tablist">
										<li class="nav-item" role="presentation">
											<button class="nav-link active" id="yolo-input-tab" data-bs-toggle="tab" data-bs-target="#yolo-input-pane" type="button" role="tab" aria-controls="yolo-input-pane" aria-selected="true">📼 원본 영상</button>
										</li>
										<li class="nav-item" role="presentation">
											<button class="nav-link" id="yolo-output-tab" data-bs-toggle="tab" data-bs-target="#yolo-output-pane" type="button" role="tab" aria-controls="yolo-output-pane" aria-selected="false">🎯 검출 영상</button>
										</li>
									</ul>
									<div class="form-check form-switch mb-0 ms-2">
										<input class="form-check-input" type="checkbox" role="switch" id="yolo-loop-toggle">
										<label class="form-check-label small" for="yolo-loop-toggle">반복 재생</label>
									</div>
								</div>
								<div class="tab-content border border-top-0 rounded-bottom p-3 bg-white" id="yolo-video-tab-content">
									<div class="tab-pane fade show active" id="yolo-input-pane" role="tabpanel" aria-labelledby="yolo-input-tab" tabindex="0">
										<div class="text-center">
											<video id="yolo-input-video" class="border rounded d-inline-block mw-100" style="width: auto; height: auto; max-height: 70vh;" controls playsinline></video>
										</div>
									</div>
									<div class="tab-pane fade" id="yolo-output-pane" role="tabpanel" aria-labelledby="yolo-output-tab" tabindex="0">
										<div class="text-center">
											<video id="yolo-output-video" class="border rounded d-inline-block mw-100" style="width: auto; height: auto; max-height: 70vh;" controls playsinline></video>
										</div>
									</div>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</main>

<script src="400_ai_yolo.js" defer></script>
</body>
</html>
