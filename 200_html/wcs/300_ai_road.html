<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Road Detection</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Font Awesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>

    <!-- WCS Common CSS -->
    <link href="./css/002_wcs_common.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js" defer></script>

     <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
            }
        }
    </script>

    <style>
        .image-drop-zone {
            border: 2px dashed #adb5bd;
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .image-drop-zone.drag-over {
            border-color: #0d6efd;
            background-color: #eaf3ff;
        }

        .sample-thumbnail-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 0.25rem;
            max-width: 100%;
        }

        .sample-thumbnail-track {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            grid-auto-columns: minmax(170px, 170px);
            gap: 0.5rem;
            width: max-content;
        }

        .sample-thumbnail-item {
            width: 170px;
        }

        .sample-thumbnail-item .sample-image-item {
            min-height: 170px;
        }

        .sample-thumbnail-item .sample-video-item {
            min-height: 170px;
        }

        .sample-thumbnail-item .sample-image-item .small {
            background-color: #0b5ed7;
            color: #ffffff;
            border-radius: 0.35rem;
            padding: 0.2rem 0.45rem;
        }

        .sample-thumbnail-item .sample-video-item .small {
            background-color: #0b5ed7;
            color: #ffffff;
            border-radius: 0.35rem;
            padding: 0.2rem 0.45rem;
        }

        .sample-thumbnail-item .sample-image-item.selected-sample,
        .sample-thumbnail-item .sample-video-item.selected-sample {
            border: 2px solid #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.2);
            transform: translateY(-1px);
        }

        .sample-thumbnail-item .sample-image-item.selected-sample .small,
        .sample-thumbnail-item .sample-video-item.selected-sample .small {
            background-color: #198754;
        }

        #road-detect-table {
            width: 100%;
            table-layout: fixed;
        }

        #road-detect-table td {
            overflow: hidden;
        }

        #input-sample-image-pane {
            overflow-x: hidden;
        }
    </style>

    <script src="./js/010_wcs_common.js" defer></script>
    <script src="./js/300_ai_road.js" defer></script>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header class="p-1 text-bg-dark fs-5">

        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">

                <ul class="nav flex-grow-1 mb-2 justify-content-center mb-md-0">
                    <li>
                        <a href="300_ai_road.html" class="nav-link px-2 text-secondary">
                            <i class="bi bi-map me-2"></i>
                            Road Detection
                        </a>
                    </li> 
                </ul>

                <ul class="nav mb-2 ms-3 mb-md-0">
                    <li>
                        <a href="100_vehicle_status.html" class="nav-link px-2 text-white">
                            <i class="bi bi-speedometer2 me-2"></i>
                            WCS
                        </a>
                    </li>
                </ul> 

            </div>
        </div>
    </header>
    <!-- // 상단 메뉴 -->

    <main class="container-fluid my-4"> 

        <div class="card">
            
            <div class="card-header text-center">
                <h4 class="mb-0"> Road Detection </h4>
            </div>

            <div class="card-body p-2">
                <div class="table-responsive">
                    <table id="road-detect-table" class="table table-bordered align-middle mb-0">
                        <colgroup>
                            <col style="width: 120px;">
                            <col>
                        </colgroup> 
                        <tbody>
                            <tr>
                                <th scope="row" class="text-center">검출 대상</th>
                                <td>
                                    <form id="detection-type-form" class="border-0 rounded p-2">
                                        <div class="d-flex flex-nowrap align-items-center gap-4 overflow-auto pe-1">
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="radio" name="detect-type" value="road" id="detect-road" checked>
                                                <label class="form-check-label" for="detect-road">도로</label>
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="radio" name="detect-type" value="road_type" id="detect-road-type">
                                                <label class="form-check-label" for="detect-road-type">도로 종류</label>
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="radio" name="detect-type" value="pothole" id="detect-pothole">
                                                <label class="form-check-label" for="detect-pothole">포트홀</label>
                                            </div>

                                        </div>
                                    </form>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-center">입력</th>
                                <td>
                                    <div class="border-0 rounded p-2">
                                        <ul class="nav nav-tabs mb-3" id="input-tabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="input-file-tab" data-bs-toggle="tab" data-bs-target="#input-file-pane" type="button" role="tab">파일</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="input-sample-image-tab" data-bs-toggle="tab" data-bs-target="#input-sample-image-pane" type="button" role="tab">샘플 영상</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="input-sample-video-tab" data-bs-toggle="tab" data-bs-target="#input-sample-video-pane" type="button" role="tab">샘플 동영상</button>
                                            </li>
                                        </ul>
                                        <div class="tab-content">
                                            <div class="tab-pane fade show active" id="input-file-pane" role="tabpanel">
                                                <form id="image-upload-form">
                                                    <input class="d-none" type="file" id="road-image-input" accept="image/*,video/*">
                                                    <div id="image-drop-zone" class="image-drop-zone">
                                                        <div class="fw-semibold">영상을 드래그해서 놓으세요</div>
                                                        <div class="small text-muted mt-1">또는 클릭하여 파일 선택</div>
                                                    </div>
                                                </form>
                                            </div>
                                            <div class="tab-pane fade" id="input-sample-image-pane" role="tabpanel">
                                                <div class="text-muted text-center py-3">샘플 영상 목록</div>
                                                <template id="sample-image-item-template">
                                                    <div class="sample-thumbnail-item">
                                                        <button type="button" class="btn btn-outline-secondary w-100 p-2 h-100 sample-image-item" data-file-name="">
                                                            <img src="" alt="" class="img-fluid rounded mb-1" style="height: 120px; width: 100%; object-fit: cover;">
                                                            <div class="small text-truncate" title=""></div>
                                                        </button>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="tab-pane fade" id="input-sample-video-pane" role="tabpanel">
                                                <div class="text-muted text-center py-3">샘플 동영상 목록</div>
                                                <template id="sample-video-item-template">
                                                    <div class="sample-thumbnail-item">
                                                        <button type="button" class="btn btn-outline-secondary w-100 p-2 h-100 sample-video-item" data-file-name="">
                                                            <video
                                                                src=""
                                                                class="img-fluid rounded mb-1"
                                                                style="height: 120px; width: 100%; object-fit: cover;"
                                                                muted
                                                                playsinline
                                                                preload="metadata"
                                                            ></video>
                                                            <div class="small text-truncate" title=""></div>
                                                        </button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-center">출력</th>
                                <td>
                                    <div class="border-0 rounded p-2">
                                        <ul class="nav nav-tabs" id="image-preview-tabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="original-image-tab" data-bs-toggle="tab" data-bs-target="#original-image-pane" type="button" role="tab" aria-controls="original-image-pane" aria-selected="true">원본 영상</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="detected-image-tab" data-bs-toggle="tab" data-bs-target="#detected-image-pane" type="button" role="tab" aria-controls="detected-image-pane" aria-selected="false">검출 영상</button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link d-flex align-items-center gap-2" id="work-status-tab" data-bs-toggle="tab" data-bs-target="#work-status-pane" type="button" role="tab" aria-controls="work-status-pane" aria-selected="false">
                                                    <span id="working-indicator" class="d-none text-primary d-flex align-items-center gap-1">
                                                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                                    </span>
                                                    <span id="work-status-message" class="d-none"></span>
                                                </button>
                                            </li>
                                        </ul>

                                        <div class="tab-content border border-top-0 rounded-bottom p-3">
                                            <div class="tab-pane fade show active" id="original-image-pane" role="tabpanel" aria-labelledby="original-image-tab" tabindex="0">
                                                <img
                                                    id="original-image-preview"
                                                    src=""
                                                    alt="원본 영상"
                                                    class="img-fluid border rounded d-none"
                                                >
                                                <video
                                                    id="original-video-preview"
                                                    class="img-fluid border rounded d-none"
                                                    controls
                                                    playsinline
                                                ></video>
                                            </div>
                                            <div class="tab-pane fade" id="detected-image-pane" role="tabpanel" aria-labelledby="detected-image-tab" tabindex="0">
                                                <div id="detecting-indicator" class="d-none my-3 text-primary d-flex align-items-center justify-content-center gap-2">
                                                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                                    <span>검출 중...</span>
                                                </div>
                                                <img
                                                    id="detected-image-preview"
                                                    src=""
                                                    alt="검출 영상"
                                                    class="img-fluid border rounded d-none"
                                                >
                                                <video
                                                    id="detected-video-preview"
                                                    class="img-fluid border rounded d-none"
                                                    controls
                                                    playsinline
                                                ></video>
                                            </div>
                                            <div class="tab-pane fade" id="work-status-pane" role="tabpanel" aria-labelledby="work-status-tab" tabindex="0"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2024 Wheel Control System. All rights reserved.</p>
    </footer>

</body>

</html>
