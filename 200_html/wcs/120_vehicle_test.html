                "three-csg-ts": "https://esm.sh/three-csg-ts@3.2.0?external=three",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js",

            }

    <script src="./js/013_wcs_components.js" defer></script>

    <script type="module" src="../urdf/urdfViewer.js?v=20260827b-ground-transparency-order"></script>
    <script src="./js/011_mqtt.js?v=20260824-wheel-angle-speed-receive" defer></script>
    <script src="./js/102_mqtt_process_status.js?v=20260824-wheel-angle-speed-receive" defer></script>
    <script src="./js/120_vehicle_test.js?v=20260824-current-speed-only" defer></script>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header class="p-1 text-bg-dark fs-5">

        <div class="container">
            <div class="top-header-row d-flex flex-wrap align-items-center justify-content-between">

                <ul class="nav flex-grow-1 mb-2 justify-content-center mb-md-0">

                    </li>

                        </a>
                    </li>
                    <li>
                        <a href="120_vehicle_test.html" class="nav-link px-2 text-white">
                            <i class="bi bi-play-circle-fill me-2"></i>
                            Vehicle Test
                        </a>
                    </li>
                </ul>

                <ul class="nav mb-2 ms-3 mb-md-0">
                    <li>
                        <a href="200_wcs_setting.html" class="nav-link px-2 text-white">

                            WCS Setting
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a href="#" class="nav-link px-2 text-white dropdown-toggle" role="button"

                            AI
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end bg-black border-secondary">
                            <li><a class="dropdown-item text-white" href="/road/300_ai_road.html"><i
                                        class="bi bi-signpost-2 me-2"></i>road detection</a></li>
                            <li><a class="dropdown-item text-white" href="/yolo/400_ai_yolo.html"><i

                            <li><a class="dropdown-item text-white" href="/sam2/500_ai_sam2.html"><i

                <div id="mqtt-header-ui"></div>

            </div>
        </div>

    <!-- // 상단 메뉴 -->

    <main class="container-fluid my-4">

        <div class="card">

            <div class="card-header text-center">
                <h4 class="mb-0">Wheel Test</h4>
            </div>

            <div class="card-body p-2">

                <table class="w-100 vehicle-test-layout-table">
                    <colgroup>
                        <col>
                        <col width="400px;">
                        <col width="400px;">
                    </colgroup>

                    <tbody>
                        <tr>

                            <td class="align-top p-0">
                                <!-- 차량 정보 -->
                                <div class="d-flex h-100 w-100">

                                    <div class="card text-center h-100 w-100">
                                        <div class="card-header text-center">
                                            <h4 class="mb-0"> Vehicle </h4>
                                        </div>

                                        <div class="card-body d-flex flex-column">

                                            <!-- 차량 URDF 뷰어 -->
                                            <div class="row">
                                                <div
                                                    class="col-md-12 p-0 d-flex align-items-center justify-content-center">
                                                    <div class="urdf-container w-100 h-100 border border-secondary border-1 vehicle-urdf-min-height"
                                                        id="vehicle-urdf-viewer" urdf="/urdf/model/vehicle/vehicle.urdf"
                                                        cameraPose="-0.981, 0.007, 1.200|-0.005, 0.059, 0.008|0.987, 0.027, 0.158"
                                                        showViewCube="true" showAttitude="false">
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- // 차량 URDF 뷰어 -->

                                        </div>
                                    </div>

                                </div>

                                <!-- // 차량 정보 -->

                            </td>

                            <td class="align-top p-0">
                                <!-- Wheel Test -->

                                <div class="d-flex h-100 w-100 ps-1">

                                    <div class="card h-100 w-100">
                                        <div class="card-header text-center">
                                            <h5 class="mb-0"> Wheel Test </h5>
                                        </div>
                                        <div class="card-body ">

                                            <!-- Wheel Selection -->
                                            <div class="mb-4">

                                                <div class="row">
                                                    <!-- 바퀴 선택 (수직) -->
                                                    <div class="col-4 d-flex flex-column">
                                                        <label class="form-label fw-bold"><i
                                                                class="bi bi-bullseye me-2"></i>휠 선택</label>

                                                        <div class="btn-group-vertical w-100 my-auto mt-0" role="group"
                                                            aria-label="Wheel selection">
                                                            <input type="radio" class="btn-check"
                                                                name="wheelTestPosition" id="wheel-test-fl" value="FL"
                                                                checked>
                                                            <label class="btn btn-outline-secondary fw-bold fs-5"
                                                                for="wheel-test-fl">FL</label>

                                                            <input type="radio" class="btn-check"
                                                                name="wheelTestPosition" id="wheel-test-fr" value="FR">
                                                            <label class="btn btn-outline-secondary fw-bold fs-5"
                                                                for="wheel-test-fr">FR</label>

                                                            <input type="radio" class="btn-check"
                                                                name="wheelTestPosition" id="wheel-test-rl" value="RL">
                                                            <label class="btn btn-outline-secondary fw-bold fs-5"
                                                                for="wheel-test-rl">RL</label>

                                                            <input type="radio" class="btn-check"
                                                                name="wheelTestPosition" id="wheel-test-rr" value="RR">
                                                            <label class="btn btn-outline-secondary fw-bold fs-5"
                                                                for="wheel-test-rr">RR</label>
                                                        </div>
                                                    </div>

                                                    <!-- 회전 테스트 버튼 -->
                                                    <div class="col-8 ps-0">
                                                        <label class="form-label fw-bold"><i
                                                                class="bi bi-controller me-2"></i>휠 동작 선택</label>

                                                        <div class="d-grid gap-2 h-100">
                                                            <button type="button"
                                                                class="btn btn-outline-secondary text-black fw-bold fs-5"
                                                                id="test-clockwise">
                                                                <i class="bi bi-arrow-clockwise me-1 fs-4"></i>정회전
                                                            </button>
                                                            <button type="button"
                                                                class="btn btn-outline-secondary text-black fw-bold fs-5"
                                                                id="test-counterclockwise">
                                                                <i
                                                                    class="bi bi-arrow-counterclockwise me-1 fs-4"></i>역회전
                                                            </button>
                                                            <button type="button"
                                                                class="btn btn-outline-secondary text-black fw-bold fs-5"
                                                                id="test-stop">
                                                                <i class="bi bi-stop-fill me-1 fs-4"></i>휠정지
                                                            </button>

                                                            <div class="mt-2 d-flex align-items-center gap-2">
                                                                <label for="wheelTestSpeedSlider"
                                                                    class="form-label fw-bold mb-0 text-nowrap">
                                                                    <i class="bi bi-speedometer2 me-2"></i>휠 속도
                                                                </label>
                                                                <input type="range" id="wheelTestSpeedSlider"
                                                                    class="form-range mb-0" min="0" max="20" step="0.5"
                                                                    value="8.0">
                                                                <span
                                                                    class="input-group-text bg-light justify-content-center text-nowrap speed-value-chip">
                                                                    <span id="wheel-test-speed-value">76 rpm</span>
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                                <!-- // Wheel Test -->

                            </td>

                            <td class="align-top p-0">

                                <!-- 차량 테스트 -->
                                <div class="d-flex h-100 w-100 ps-1">
                                    <div class="card h-100 w-100">
                                        <div class="card-header text-center">
                                            <h5 class="mb-0">Vehicle Test</h5>
                                        </div>
                                        <div class="card-body">

                                            <!-- 차량 이동 제어 -->
                                            <div class="mb-4">
                                                <label class="form-label fw-bold"><i
                                                        class="bi bi-arrow-up-circle me-2"></i>방향 제어</label>

                                                <!-- 전진/후진 -->
                                                <div class="row mb-3">
                                                    <div class="col-6 pe-1">
                                                        <button type="button"
                                                            class="btn btn-outline-secondary text-black w-100 py-3 fw-bold fs-5"
                                                            id="vehicle-forward">
                                                            <i class="bi bi-arrow-up me-2 fs-4"></i>전진
                                                        </button>
                                                    </div>
                                                    <div class="col-6 ps-1">
                                                        <button type="button"
                                                            class="btn btn-outline-secondary text-black w-100 py-3 fw-bold fs-5"
                                                            id="vehicle-backward">
                                                            <i class="bi bi-arrow-down me-2 fs-4"></i>후진
                                                        </button>
                                                    </div>
                                                </div>

                                                <!-- 좌회전/우회전 -->
                                                <div class="row mb-3">
                                                    <div class="col-6 pe-1">
                                                        <button type="button"
                                                            class="btn btn-outline-secondary text-black w-100 py-3 fw-bold fs-5"
                                                            id="vehicle-turn-left">
                                                            <i class="bi bi-arrow-left me-2 fs-4"></i>좌회전
                                                        </button>
                                                    </div>
                                                    <div class="col-6 ps-1">
                                                        <button type="button"
                                                            class="btn btn-outline-secondary text-black w-100 py-3 fw-bold fs-5"
                                                            id="vehicle-turn-right">
                                                            <i class="bi bi-arrow-right me-2 fs-4"></i>우회전
                                                        </button>
                                                    </div>
                                                </div>

                                                <!-- 정지 -->
                                                <div class="d-grid">
                                                    <button type="button"
                                                        class="btn btn-outline-secondary text-black py-3 fw-bold fs-5"
                                                        id="vehicle-stop">
                                                        <i class="bi bi-stop-circle me-2 fs-4"></i> 정지
                                                    </button>
                                                </div>
                                            </div>

                                            <!-- 차량 속도 제어 -->
                                            <div class="mb-3">
                                                <div class="d-flex align-items-center gap-2">
                                                    <label for="vehicleCurrSpeedSlider"
                                                        class="form-label fw-bold mb-0 text-nowrap">
                                                        <i class="bi bi-speedometer2 me-2"></i>차량 속도
                                                    </label>
                                                    <input type="range" id="vehicleCurrSpeedSlider"
                                                        class="form-range mb-0" min="0.1" max="27.8" step="0.1"
                                                        value="1.4">
                                                    <span
                                                        class="input-group-text bg-light justify-content-center text-nowrap speed-value-chip">
                                                        <span id="vehicle/linear/speed">1.4 m/s</span>
                                                    </span>
                                                </div>
                                            </div>
                                            <!-- // 차량 속도 제어 -->

                                        </div>
                                    </div>
                                </div>
                                <!-- // 차량 테스트 -->

                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2024 Wheel Control System. All rights reserved.</p>
    </footer>

</body>

</html>
