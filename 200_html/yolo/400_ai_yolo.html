<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AI YOLO Video Detect</title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<header class="p-2 text-bg-dark fs-5">
	<div class="container d-flex justify-content-between align-items-center">
		<div>YOLO Video Detection</div>
		<a href="300_ai_road.html" class="btn btn-outline-light btn-sm">Road Detection</a>
	</div>
</header>

<main class="container my-4">
	<div class="card shadow-sm">
		<div class="card-header">
			<h5 class="mb-0">동영상 업로드 후 YOLO 최신 모델 검출</h5>
		</div>
		<div class="card-body">
			<div class="row g-3 align-items-end">
				<div class="col-12 col-lg-5">
					<label for="yolo-video-file" class="form-label">동영상 파일</label>
					<input id="yolo-video-file" class="form-control" type="file" accept="video/*">
				</div>
				<div class="col-6 col-lg-2">
					<label for="yolo-conf" class="form-label">Conf</label>
					<input id="yolo-conf" class="form-control" type="number" min="0" max="1" step="0.05" value="0.25">
				</div>
				<div class="col-6 col-lg-2">
					<label for="yolo-iou" class="form-label">IoU</label>
					<input id="yolo-iou" class="form-control" type="number" min="0" max="1" step="0.05" value="0.45">
				</div>
				<div class="col-12 col-lg-3 d-grid">
					<button id="yolo-detect-btn" class="btn btn-primary">검출 시작</button>
				</div>
			</div>

			<div id="yolo-status" class="alert alert-secondary mt-3 mb-0">대기 중</div>

			<div class="row mt-3 g-3">
				<div class="col-12 col-xl-6">
					<div class="card h-100">
						<div class="card-header py-2">원본 영상</div>
						<div class="card-body">
							<video id="yolo-input-video" class="w-100 border rounded" controls playsinline></video>
						</div>
					</div>
				</div>
				<div class="col-12 col-xl-6">
					<div class="card h-100">
						<div class="card-header py-2">검출 영상</div>
						<div class="card-body">
							<video id="yolo-output-video" class="w-100 border rounded" controls playsinline></video>
						</div>
					</div>
				</div>
			</div>

			<div class="card mt-3">
				<div class="card-header py-2">검출 결과 요약</div>
				<div class="card-body">
					<pre id="yolo-result-json" class="small mb-0" style="white-space: pre-wrap;">(검출 결과 없음)</pre>
				</div>
			</div>
		</div>
	</div>
</main>

<script src="400_ai_yolo.js" defer></script>
</body>
</html>
