<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Road Detection</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Font Awesome JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>

    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- WCS Common CSS -->
    <link href="../wcs/css/002_wcs_common.css" rel="stylesheet">
    <link href="../wcs/css/300_ai_road.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

     <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <!-- Import map for module resolution -->
    <script type="importmap">
        {
        "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
                "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/",
                "three-csg-ts": "https://esm.sh/three-csg-ts@3.2.0?external=three",
                "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js",
                "RapierPhysics": "https://cdn.jsdelivr.net/npm/three@0.160/addons/physics/RapierPhysics.js"
            }
        }
    </script>

    <script src="../wcs/js/010_wcs_common.js" defer></script>
    <script src="../wcs/js/300_ai_road.js" defer></script>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header class="p-1 text-bg-dark fs-5">

        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">

                <ul class="nav flex-grow-1 mb-2 justify-content-center mb-md-0">
                    <li>
                        <a href="300_ai_road.html" class="nav-link px-2 text-secondary">
                            <i class="bi bi-map me-2"></i> Road Detection
                        </a>
                    </li>
                </ul>

                <ul class="nav mb-2 ms-3 mb-md-0">
                    <li>
                        <a href="../yolo/400_ai_yolo.html" class="nav-link px-2 text-white">
                            <i class="bi bi-bounding-box-circles me-2"></i> YOLO
                        </a>
                    </li>
                    <li>
                        <a href="../sam2/500_ai_sam2.html" class="nav-link px-2 text-white">
                            <i class="bi bi-grid-3x3-gap me-2"></i> SAM2 
                        </a>
                    </li>
                    <li>
                        <a href="../wcs/100_vehicle_status.html" class="nav-link px-2 text-white">
                            <i class="bi bi-speedometer2 me-2"></i> WCS
                        </a>
                    </li>
                </ul> 

            </div>
        </div>
    </header>
    <!-- // 상단 메뉴 -->

    <main class="container-fluid my-4"> 

        <div class="card">
            
            <div class="card-header text-center">
                <h4 class="mb-0"> Road Detection </h4>
            </div>

            <div class="card-body p-2">
                <div class="table-responsive">
                    <table id="road-detect-table" class="table table-bordered align-middle mb-0">
                        <colgroup>
                            <col style="width: 120px;">
                            <col>
                        </colgroup> 
                        <tbody>
                            <tr>
                                <th scope="row" class="text-center">검출 대상</th>
                                <td>
                                    <form id="detection-type-form" class="border-0 rounded p-2">
                                        <div class="d-flex flex-nowrap align-items-center gap-4 overflow-auto pe-1">
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="radio" name="detect-type" value="road" id="detect-road" checked>
                                                <label class="form-check-label" for="detect-road">도로</label>
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="radio" name="detect-type" value="road_type" id="detect-road-type">
                                                <label class="form-check-label" for="detect-road-type">도로 종류</label>
                                            </div>
                                            <div class="vr mx-1"></div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="checkbox" id="enable-pothole-detect">
                                                <label class="form-check-label" for="enable-pothole-detect">포트홀 검출</label>
                                            </div>
                                            <div class="d-flex align-items-center gap-2 text-nowrap">
                                                <label for="pothole-confidence" class="form-label mb-0">신뢰도</label>
                                                <input
                                                    id="pothole-confidence"
                                                    type="number"
                                                    class="form-control form-control-sm text-end"
                                                    min="0"
                                                    max="1"
                                                    step="0.05"
                                                    value="0.4"
                                                    style="width: 60px;"
                                                >
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="checkbox" id="remove-noisy-masks" checked>
                                                <label class="form-check-label" for="remove-noisy-masks">군더더기 삭제</label>
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="checkbox" id="show-detect-stats-chart" checked>
                                                <label class="form-check-label" for="show-detect-stats-chart">검출 통계 출력</label>
                                            </div>
                                            <div class="form-check mb-0 text-nowrap">
                                                <input class="form-check-input" type="checkbox" id="enable-mqtt-publish">
                                                <label class="form-check-label" for="enable-mqtt-publish">MQTT 연계</label>
                                            </div>
                                        </div>
                                    </form>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-center">입력</th>
                                <td>
                                    <div class="border-0 rounded p-2">
                                        <ul class="nav nav-tabs mb-3" id="input-tabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active" id="input-file-tab" data-bs-toggle="tab" data-bs-target="#input-file-pane" type="button" role="tab">
                                                    <i class="bi bi-folder2-open me-1"></i>파일
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="input-sample-image-tab" data-bs-toggle="tab" data-bs-target="#input-sample-image-pane" type="button" role="tab">
                                                    <i class="bi bi-image me-1"></i>샘플 영상
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="input-sample-video-tab" data-bs-toggle="tab" data-bs-target="#input-sample-video-pane" type="button" role="tab">
                                                    <i class="bi bi-camera-reels me-1"></i>샘플 동영상
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link" id="input-camera-tab" data-bs-toggle="tab" data-bs-target="#input-camera-pane" type="button" role="tab">
                                                    <i class="bi bi-camera-video me-1"></i>카메라
                                                </button>
                                            </li>
                                        </ul>
                                        <div class="tab-content">
                                            <div class="tab-pane fade show active" id="input-file-pane" role="tabpanel">
                                                <form id="image-upload-form">
                                                    <input class="d-none" type="file" id="road-image-input" accept="image/*,video/*">
                                                    <div id="image-drop-zone" class="image-drop-zone">
                                                        <div class="fw-semibold">영상을 드래그해서 놓으세요</div>
                                                        <div class="small text-muted mt-1">또는 클릭하여 파일 선택</div>
                                                    </div>
                                                </form>
                                            </div>
                                            <div class="tab-pane fade" id="input-sample-image-pane" role="tabpanel">
                                                <div class="text-muted text-center py-3">샘플 영상 목록</div>
                                                <template id="sample-image-item-template">
                                                    <div class="sample-thumbnail-item">
                                                        <button type="button" class="btn btn-outline-secondary w-100 p-2 h-100 sample-image-item" data-file-name="">
                                                            <img src="" alt="" class="img-fluid rounded mb-1" style="height: 120px; width: 100%; object-fit: cover;">
                                                            <div class="small text-truncate" title=""></div>
                                                        </button>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="tab-pane fade" id="input-sample-video-pane" role="tabpanel">
                                                <div class="text-muted text-center py-3">샘플 동영상 목록</div>
                                                <template id="sample-video-item-template">
                                                    <div class="sample-thumbnail-item">
                                                        <button type="button" class="btn btn-outline-secondary w-100 p-2 h-100 sample-video-item" data-file-name="">
                                                            <img
                                                                src=""
                                                                alt=""
                                                                class="img-fluid rounded mb-1 sample-video-thumbnail"
                                                                style="height: 120px; width: 100%; object-fit: cover;"
                                                            >
                                                            <video
                                                                src=""
                                                                class="img-fluid rounded mb-1"
                                                                style="height: 120px; width: 100%; object-fit: cover;"
                                                                hidden
                                                                muted
                                                                playsinline
                                                                preload="metadata"
                                                            ></video>
                                                            <div class="small text-truncate" title=""></div>
                                                        </button>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="tab-pane fade" id="input-camera-pane" role="tabpanel">
                                                <div id="camera-device-list" class="list-group">
                                                    <div class="text-muted text-center py-3">카메라 장치 목록</div>
                                                </div>
                                                <template id="camera-device-list-container-template">
                                                    <div class="d-flex flex-nowrap gap-2 overflow-auto py-1"></div>
                                                </template>
                                                <template id="camera-device-item-template">
                                                    <button type="button" class="btn btn-light border rounded px-3 py-2 flex-shrink-0 camera-device-item" data-camera-index="" data-camera-name="">
                                                        <div class="d-flex align-items-center gap-2">
                                                            <span class="badge text-bg-secondary rounded-pill camera-device-name"></span>
                                                            <span class="small text-muted camera-device-detail"></span>
                                                            <span class="badge text-bg-danger d-none camera-device-live-badge">LIVE</span>
                                                        </div>
                                                    </button>
                                                </template>
                                            </div> 
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-center">출력</th>
                                <td>
                                    <div class="border-0 rounded p-2">
                                        <ul class="nav nav-tabs" id="image-preview-tabs" role="tablist">
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link active d-flex align-items-center gap-2" id="original-image-tab" data-bs-toggle="tab" data-bs-target="#original-image-pane" type="button" role="tab" aria-controls="original-image-pane" aria-selected="true">
                                                    <span>원본 영상</span>
                                                    <span id="original-live-badge" class="badge text-bg-danger d-none">LIVE</span>
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link d-flex align-items-center gap-2" id="detected-image-tab" data-bs-toggle="tab" data-bs-target="#detected-image-pane" type="button" role="tab" aria-controls="detected-image-pane" aria-selected="false">
                                                    <span>검출 영상</span>
                                                    <span id="detected-live-badge" class="badge text-bg-danger d-none">LIVE</span>
                                                </button>
                                            </li>
                                            <li class="nav-item" role="presentation">
                                                <button class="nav-link d-flex align-items-center gap-2" id="work-status-tab" data-bs-toggle="tab" data-bs-target="#work-status-pane" type="button" role="tab" aria-controls="work-status-pane" aria-selected="false" disabled>
                                                    <span id="working-indicator" class="d-none text-primary d-flex align-items-center gap-1">
                                                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                                    </span>
                                                    <span id="work-status-message" class="d-none"></span>
                                                </button>
                                            </li>
                                        </ul>

                                        <div class="tab-content border border-top-0 rounded-bottom p-3">
                                            <div class="tab-pane fade show active" id="original-image-pane" role="tabpanel" aria-labelledby="original-image-tab" tabindex="0">
                                                <div class="roi-editor-toolbar">
                                                    <button type="button" id="roi-reset-button" class="btn btn-sm btn-outline-secondary">ROI 원복</button>
                                                    <button type="button" id="roi-full-button" class="btn btn-sm btn-outline-primary">ROI 전체</button>
                                                    <span id="roi-editor-status" class="small text-muted">ROI를 수정할 수 있습니다.</span>
                                                </div>
                                                <div id="original-media-stage" class="roi-media-stage">
                                                    <img
                                                        id="original-image-preview"
                                                        src=""
                                                        alt="원본 영상"
                                                        class="img-fluid border rounded d-none"
                                                    >
                                                    <video
                                                        id="original-video-preview"
                                                        class="img-fluid border rounded d-none"
                                                        controls
                                                        playsinline
                                                    ></video>
                                                    <div id="roi-overlay" class="roi-overlay d-none">
                                                        <div id="roi-selection" class="roi-selection">
                                                            <span class="roi-handle roi-handle-nw" data-handle="nw"></span>
                                                            <span class="roi-handle roi-handle-ne" data-handle="ne"></span>
                                                            <span class="roi-handle roi-handle-sw" data-handle="sw"></span>
                                                            <span class="roi-handle roi-handle-se" data-handle="se"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="tab-pane fade" id="detected-image-pane" role="tabpanel" aria-labelledby="detected-image-tab" tabindex="0">
                                                <div id="detected-stream-controls" class="d-none d-flex flex-wrap align-items-center gap-2 mb-3">
                                                    <button type="button" id="detected-stream-restart" class="btn btn-sm btn-outline-secondary px-2 py-0 lh-1" title="처음부터 재생" aria-label="처음부터 재생">
                                                        <i class="bi bi-skip-start-fill fs-4 lh-1"></i>
                                                    </button>
                                                    <button type="button" id="detected-stream-pause" class="btn btn-sm btn-outline-secondary px-2 py-0 lh-1" title="멈춤" aria-label="멈춤">
                                                        <i class="bi bi-pause-fill fs-4 lh-1"></i>
                                                    </button>
                                                    <button type="button" id="detected-stream-resume" class="btn btn-sm btn-outline-primary px-2 py-0 lh-1" title="다시 시작" aria-label="다시 시작">
                                                        <i class="bi bi-play-fill fs-4 lh-1"></i>
                                                    </button>
                                                    <button type="button" id="detected-video-download" class="btn btn-sm btn-outline-success">
                                                        <i class="bi bi-download me-1"></i>다운로드
                                                    </button>
                                                    <div class="d-flex align-items-center gap-2" style="min-width: 320px; flex: 1 1 320px;">
                                                        <input type="range" id="detected-stream-frame-input" class="form-range m-0" min="1" max="1" step="1" value="1">
                                                    </div>
                                                    <span id="detected-stream-frame-label" class="small text-muted"></span>
                                                </div>
                                                <div id="detected-output-url-controls" class="d-flex flex-wrap align-items-center gap-2 mb-3">
                                                    <span class="small text-muted">검출 URL</span>
                                                    <input
                                                        type="text"
                                                        id="detected-output-url"
                                                        class="form-control form-control-sm"
                                                        style="min-width: 280px; flex: 1 1 320px;"
                                                        placeholder="검출 영상 URL이 여기에 표시됩니다"
                                                        readonly
                                                    >
                                                    <button type="button" id="detected-output-url-copy" class="btn btn-sm btn-outline-secondary" disabled>
                                                        <i class="bi bi-clipboard me-1"></i>복사
                                                    </button>
                                                    <button type="button" id="detected-output-url-open" class="btn btn-sm btn-outline-primary" disabled>
                                                        <i class="bi bi-box-arrow-up-right me-1"></i>새 탭 열기
                                                    </button>
                                                    <span id="detected-output-url-hint" class="small text-muted"></span>
                                                </div>
                                                <div id="download-progress-container" class="d-none mb-3">
                                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                                        <span class="small fw-semibold">동영상 다운로드 중</span>
                                                        <span id="download-progress-text" class="small text-muted">0%</span>
                                                    </div>
                                                    <div class="progress" style="height: 1.5rem;">
                                                        <div id="download-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                                    </div>
                                                </div>
                                                <div id="detected-media-row">
                                                    <div id="detected-media-content">
                                                        <img
                                                            id="detected-image-preview"
                                                            src=""
                                                            alt="검출 영상"
                                                            class="img-fluid border rounded d-none"
                                                        >
                                                        <video
                                                            id="detected-video-preview"
                                                            class="img-fluid border rounded d-none"
                                                            controls
                                                            playsinline
                                                        ></video>
                                                    </div>
                                                    <div id="detected-image-download-wrap" class="d-none">
                                                        <button type="button" id="detected-image-download" class="btn btn-sm btn-outline-success">
                                                            <i class="bi bi-download me-1"></i>다운로드
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="tab-pane fade" id="work-status-pane" role="tabpanel" aria-labelledby="work-status-tab" tabindex="0">
                                                <div id="work-status-pane-message" class="small text-muted">대기 중...</div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2024 Wheel Control System. All rights reserved.</p>
    </footer>

</body>

</html>
