<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Speech API TTS 예제</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 40px;
		}

		textarea {
			width: 100%;
			max-width: 700px;
			height: 150px;
			font-size: 16px;
		}

		button {
			margin-top: 10px;
			margin-right: 10px;
			padding: 10px 20px;
			font-size: 16px;
		}

		.example-list {
			max-width: 700px;
			margin-top: 14px;
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.example-item {
			padding: 8px 12px;
			border: 1px solid #ced4da;
			border-radius: 6px;
			background: #f8f9fa;
			cursor: pointer;
			user-select: none;
		}

		.example-item:hover {
			background: #e9ecef;
		}

		.example-item.active {
			background: #dbeafe;
			border-color: #93c5fd;
			color: #1d4ed8;
			font-weight: 700;
		}
	</style>
</head>

<body>

	<h2>HTML TTS 예제</h2>

	<textarea id="text">안녕하세요. Web Speech API를 이용한 TTS 테스트입니다.</textarea>
	<br>

	<button onclick="speak()">읽기</button>
	<button onclick="stopSpeak()">정지</button>
	<button onclick="speakRoadExamples()">음성 예제 전체 출력</button>

	<div id="example-list" class="example-list">
		<span class="example-item" onclick="speakRoadMessage(this)">아스팔트입니다.</span>
		<span class="example-item" onclick="speakRoadMessage(this)">보도블록입니다.</span>
		<span class="example-item" onclick="speakRoadMessage(this)">자갈길입니다.</span>
		<span class="example-item" onclick="speakRoadMessage(this)">흙길입니다.</span>
		<br/>
		<span class="example-item" onclick="speakRoadMessage(this)">차량이 기울어졌습니다.</span>
		<span class="example-item" onclick="speakRoadMessage(this)">차량이 기울기가 원보되었습니다.</span>
	</div>

	<script>
		let voices = [];

		function loadVoices() {
			voices = speechSynthesis.getVoices();
		}

		speechSynthesis.onvoiceschanged = loadVoices;
		loadVoices();

		function speak() {

			speechSynthesis.cancel();

			const utter = new SpeechSynthesisUtterance(
				document.getElementById("text").value
			);

			utter.lang = "ko-KR";
			utter.rate = 1.0;
			utter.pitch = 1.0;
			utter.volume = 1.0;

			const koreanVoice = voices.find(v => v.lang === "ko-KR");
			if (koreanVoice) {
				utter.voice = koreanVoice;
			}

			utter.onstart = () => console.log("TTS 시작");
			utter.onend = () => console.log("TTS 종료");
			utter.onerror = e => console.log(e);

			speechSynthesis.speak(utter);
		}

		function stopSpeak() {
			speechSynthesis.cancel();
		}

		function speakMessage(message) {
			speechSynthesis.cancel();

			const utter = new SpeechSynthesisUtterance(message);
			utter.lang = "ko-KR";
			utter.rate = 1.0;
			utter.pitch = 1.0;
			utter.volume = 1.0;

			const koreanVoice = voices.find(v => v.lang === "ko-KR");
			if (koreanVoice) {
				utter.voice = koreanVoice;
			}

			utter.onerror = e => console.log(e);
			speechSynthesis.speak(utter);
		}

		function speakRoadMessage(exampleElement) {
			if (!exampleElement) {
				return;
			}

			const message = exampleElement.textContent.trim();
			if (!message) {
				return;
			}

			const items = Array.from(document.querySelectorAll("#example-list .example-item"));
			const activeIndex = items.indexOf(exampleElement);
			setActiveExampleItem(activeIndex);

			document.getElementById("text").value = message;

			speakMessage(message);
		}

		function setActiveExampleItem(activeIndex) {
			const items = document.querySelectorAll("#example-list .example-item");
			items.forEach((item, index) => {
				item.classList.toggle("active", index === activeIndex);
			});
		}

		function speakRoadExamples() {
			speechSynthesis.cancel();
			const messages = Array.from(document.querySelectorAll("#example-list .example-item"))
				.map(item => item.textContent.trim())
				.filter(message => message.length > 0);

			let index = 0;

			const speakNext = () => {
				if (index >= messages.length) {
					setActiveExampleItem(-1);
					return;
				}

				setActiveExampleItem(index);

				const utter = new SpeechSynthesisUtterance(messages[index]);
				utter.lang = "ko-KR";
				utter.rate = 1.0;
				utter.pitch = 1.0;
				utter.volume = 1.0;

				const koreanVoice = voices.find(v => v.lang === "ko-KR");
				if (koreanVoice) {
					utter.voice = koreanVoice;
				}

				utter.onend = () => {
					index += 1;
					speakNext();
				};

				utter.onerror = e => console.log(e);
				speechSynthesis.speak(utter);
			};

			speakNext();
		}
	</script>

</body>

</html>
